<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08111f">
<title>Shatter Glass</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353 0,#091727 46%,#050a12 100%);color:#f7fbff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:#8de7ff}.badge{font-size:12px;color:#a7bbcf;padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04)}.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(183,228,255,.12),rgba(255,255,255,.024));box-shadow:inset 0 0 70px rgba(160,220,255,.04),0 24px 70px rgba(0,0,0,.36);transition:background .18s}.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 36%,rgba(255,255,255,.09) 46%,transparent 57%);pointer-events:none;transition:opacity .16s}.stage.gone{background:rgba(4,9,16,.18)}.stage.gone:before{opacity:0}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0;transform:translateY(-46%) scale(.97)}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:5}.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);box-shadow:0 0 18px rgba(124,226,255,.65);transition:width .18s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}button.primary{background:#eefbff;color:#07111f}.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.24s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16)}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style></head><body>
<div class="wrap"><div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Every hit fractures differently.</small></div><div class="flash" id="flash"></div><div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div><div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div></div>
<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,hits=[],chips=[],falling=[],dead=false,soundOn=true,audio=null,collapseAt=0;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw();if(!dead)damage()}addEventListener('resize',resize);
function path(sx,sy,a,len,rough){let pts=[[sx,sy]],cx=sx,cy=sy,ang=a,steps=Math.max(3,Math.floor(len/R(13,24)));for(let i=0;i<steps;i++){ang+=R(-rough,rough);let step=len/steps*R(.55,1.45);cx+=Math.cos(ang)*step;cy+=Math.sin(ang)*step;pts.push([cx,cy]);if(cx<-20||cy<-20||cx>W+20||cy>H+20)break}return pts}
function arcPath(cx,cy,r){let pts=[],start=R(0,Math.PI*2),span=R(.45,2.1),n=Math.floor(R(7,18));for(let i=0;i<=n;i++){let a=start+span*i/n+R(-.06,.06),rr=r*R(.8,1.18);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}return pts}
function newHit(px,py){let mode=Math.floor(R(0,5)),n=[5,14,8,4,10][mode],rad=Math.min(W,H)*[R(.15,.24),R(.07,.13),R(.11,.19),R(.2,.3),R(.09,.16)][mode],lines=[],arcs=[],rot=R(0,6.28);for(let i=0;i<n;i++){let a=mode===3?rot+i*R(.8,1.6):rot+6.28*i/n+R(-.28,.28),len=rad*R(.45,Math.random()<.22?2.0:1.25),p=path(px,py,a,len,R(.06,.24));lines.push({p,w:R(.22,.72),a:R(.28,.76)});if(p.length>3&&Math.random()<.55){let k=Math.floor(R(1,p.length-1)),q=p[k];lines.push({p:path(q[0],q[1],a+R(-1.35,1.35),len*R(.12,.42),R(.1,.28)),w:R(.18,.45),a:R(.18,.48)})}}
let ac=mode===4?Math.floor(R(2,5)):Math.floor(R(0,3));for(let i=0;i<ac;i++)arcs.push({p:arcPath(px,py,rad*R(.18,.8)),w:R(.18,.4),a:R(.12,.32)});return{x:px,y:py,level:1,rad,lines,arcs}}
function near(px,py){let b=null,d=54;for(const h of hits){let q=Math.hypot(h.x-px,h.y-py);if(q<d){d=q;b=h}}return b}
function deepen(h){h.level=Math.min(7,h.level+1);for(let i=0;i<Math.floor(R(2,5))+h.level;i++){let a=R(0,6.28),sr=R(2,22);h.lines.push({p:path(h.x+Math.cos(a)*sr,h.y+Math.sin(a)*sr,a+R(-.6,.6),h.rad*R(.22,1.05),R(.08,.26)),w:R(.18,.58),a:R(.2,.6)})}if(Math.random()<.65)h.arcs.push({p:arcPath(h.x,h.y,h.rad*R(.28,.95)),w:R(.18,.36),a:R(.12,.28)});if(h.level>=5&&Math.random()<.35)chips.push({x:h.x+R(-10,10),y:h.y+R(-10,10),r:R(3,7),a:R(0,6.28)})}
function stroke(o){if(o.p.length<2)return;x.beginPath();x.moveTo(...o.p[0]);for(let i=1;i<o.p.length;i++)x.lineTo(...o.p[i]);x.strokeStyle=`rgba(232,247,252,${o.a})`;x.lineWidth=o.w;x.lineCap='butt';x.lineJoin='miter';x.stroke()}
function drawHit(h){for(const a of h.arcs)stroke(a);for(const l of h.lines)stroke(l);x.beginPath();x.arc(h.x,h.y,R(.7,1.35),0,6.28);x.fillStyle='rgba(245,252,255,.58)';x.fill()}
function drawChips(){for(const q of chips){x.save();x.translate(q.x,q.y);x.rotate(q.a);x.beginPath();x.moveTo(-q.r*.8,0);x.lineTo(-q.r*.2,-q.r);x.lineTo(q.r*.9,-q.r*.25);x.lineTo(q.r*.45,q.r*.85);x.closePath();x.fillStyle='rgba(160,205,224,.08)';x.strokeStyle='rgba(232,248,255,.38)';x.lineWidth=.5;x.fill();x.stroke();x.restore()}}
function makePolyShard(scale){let r=R(14,46)*scale,n=Math.floor(R(3,7)),pts=[],base=R(0,6.28);for(let i=0;i<n;i++){let a=base+6.28*i/n+R(-.3,.3),rr=r*R(.45,1.3);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}return pts}
function buildFalling(){falling=[];let specs=[[9,1.45],[20,.9],[34,.48]];for(const [count,scale] of specs){for(let i=0;i<count;i++){let px=R(-20,W+20),py=R(-20,H+20),edge=Math.min(px,W-px,py,H-py),delay=R(0,.18)+(H-py)/H*.09;falling.push({x:px,y:py,p:makePolyShard(scale),vx:R(-2.4,2.4)+(px-W/2)/W*1.8,vy:R(-2.4,.8),g:R(.12,.25),rot:R(0,6.28),vr:R(-.07,.07),a:1,delay,gl:R(.05,.18),edge})}}}
function drawFalling(){let t=(performance.now()-collapseAt)/1000;for(const s of falling){if(t<s.delay)continue;x.save();x.translate(s.x,s.y);x.rotate(s.rot);x.beginPath();x.moveTo(...s.p[0]);for(let i=1;i<s.p.length;i++)x.lineTo(...s.p[i]);x.closePath();x.fillStyle=`rgba(185,224,240,${Math.max(0,s.a)*s.gl})`;x.strokeStyle=`rgba(238,250,255,${Math.max(0,s.a)*.56})`;x.lineWidth=.65;x.fill();x.stroke();x.restore()}}
function draw(){x.clearRect(0,0,W,H);if(dead){drawFalling();return}for(const h of hits)drawHit(h);drawChips()}
function anim(){if(dead){let t=(performance.now()-collapseAt)/1000;for(const s of falling){if(t<s.delay)continue;s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;s.rot+=s.vr;s.a-=.0028}falling=falling.filter(s=>s.a>0&&s.y<H+220);draw()}requestAnimationFrame(anim)}
function coverage(){let cols=12,rows=18,cw=W/cols,ch=H/rows,set=new Set();for(const h of hits){let eff=h.rad*(.65+h.level*.12);for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){let px=(cc+.5)*cw,py=(r+.5)*ch;if(Math.hypot(px-h.x,py-h.y)<eff)set.add(r*cols+cc)}}let a=set.size/(cols*rows)*78,b=hits.reduce((s,h)=>s+Math.min(3.5,h.level*.42),0)+chips.length*.45;return C(a+b,0,100)}
function damage(){let d=Math.round(coverage());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96&&!dead)collapse()}
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function tap(power=1){if(!soundOn)return;let A=ac(),now=A.currentTime;for(let j=0;j<2;j++){let o=A.createOscillator(),g=A.createGain(),bp=A.createBiquadFilter();o.type=j?'triangle':'sine';o.frequency.setValueAtTime(R(j?1700:2800,j?2400:4200),now);o.frequency.exponentialRampToValueAtTime(R(650,1100),now+.035);bp.type='bandpass';bp.frequency.value=j?1900:3200;bp.Q.value=2.5;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime((j?.035:.055)*power,now+.001);g.gain.exponentialRampToValueAtTime(.0001,now+.06);o.connect(bp).connect(g).connect(A.destination);o.start(now);o.stop(now+.07)}}
function shatterSound(){if(!soundOn)return;let A=ac(),now=A.currentTime,len=Math.floor(A.sampleRate*.75),buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){let e=Math.pow(1-i/len,1.35);d[i]=(Math.random()*2-1)*e*(Math.random()<.015?2.6:.7)}let src=A.createBufferSource(),hp=A.createBiquadFilter(),g=A.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=800;g.gain.setValueAtTime(.25,now);g.gain.exponentialRampToValueAtTime(.015,now+.75);src.connect(hp).connect(g).connect(A.destination);src.start(now);for(let i=0;i<8;i++)setTimeout(()=>tap(R(.22,.48)),35+i*42)}
function collapse(){dead=true;fill.style.width='100%';pct.textContent='100%';flash.animate([{opacity:.38},{opacity:0}],{duration:120});buildFalling();collapseAt=performance.now()+110;setTimeout(()=>{stage.classList.add('gone');shatterSound();navigator.vibrate?.([15,20,35])},110);setTimeout(()=>destroyed.classList.add('show'),720)}
function impact(px,py){if(dead)return;hint.classList.add('hide');let h=near(px,py),repeat=!!h;if(h)deepen(h);else{h=newHit(px,py);hits.push(h)}tap(repeat?1.05:.78);navigator.vibrate?.(repeat?10:6);flash.animate([{opacity:.055},{opacity:0}],{duration:55});draw();damage()}
stage.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});resetBtn.onclick=()=>{hits=[];chips=[];falling=[];dead=false;stage.classList.remove('gone');destroyed.classList.remove('show');hint.classList.remove('hide');draw();damage();tap(.3)};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};resize();anim();
</script></body></html>
