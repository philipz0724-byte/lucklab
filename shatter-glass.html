<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08111f" />
<title>Shatter Glass</title>
<style>
:root{--bg:#08111f;--text:#f7fbff;--muted:#9bb0c8;--accent:#8de7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 18%,#173457 0,#0a1729 42%,#050b14 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:900;letter-spacing:.04em;font-size:19px}.title span{color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.04)}
.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(185,230,255,.12),rgba(255,255,255,.025));box-shadow:inset 0 0 60px rgba(160,220,255,.05),0 24px 70px rgba(0,0,0,.35)}
.stage:before,.stage:after{content:"";position:absolute;pointer-events:none}.stage:before{inset:-25%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 44%,transparent 55%);transform:translateX(-18%)}.stage:after{inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent 35%)}
canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.25s;z-index:3}.hint strong{display:block;font-size:28px;letter-spacing:.04em}.hint small{display:block;color:#bed4e8;margin-top:7px;font-size:14px}.hint.hide{opacity:0;transform:translateY(-45%) scale(.96)}
.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:4}.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:0 2px}.meter{height:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7ce2ff,#d7fbff);box-shadow:0 0 18px rgba(124,226,255,.7);transition:width .18s ease}.pct{font-weight:900;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;color:white;background:#132641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex:1}button.primary{background:#eefbff;color:#07111f}
.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.25s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 60px rgba(0,0,0,.45)}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div>
<div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Cracks stay where you make them.</small></div><div class="flash" id="flash"></div><div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div></div>
<div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
<div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,impacts=[],particles=[],damage=0,dead=false,soundOn=true,audio=null;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
addEventListener('resize',resize);
function polyline(x,y,angle,len,rough=.18){const pts=[[x,y]];let cx=x,cy=y;const steps=Math.max(4,Math.floor(len/16));let a=angle;for(let i=0;i<steps;i++){a+=rand(-rough,rough);const step=len/steps*rand(.82,1.18);cx+=Math.cos(a)*step;cy+=Math.sin(a)*step;pts.push([cx,cy]);if(cx<-20||cy<-20||cx>W+20||cy>H+20)break;}return pts;}
function makeImpact(x,y){const spokes=Math.floor(rand(8,13)),base=Math.min(W,H)*rand(.12,.19),segments=[];for(let i=0;i<spokes;i++){const angle=(Math.PI*2/spokes)*i+rand(-.18,.18);const pts=polyline(x,y,angle,base*rand(.75,1.35),.14);segments.push({pts,w:rand(.55,1.15),alpha:rand(.72,.95)});if(pts.length>3&&Math.random()<.72){const bi=Math.floor(rand(2,pts.length-1)),p=pts[bi],ba=angle+rand(-1.0,1.0);segments.push({pts:polyline(p[0],p[1],ba,base*rand(.18,.42),.2),w:rand(.4,.75),alpha:rand(.42,.68)});}}
const rings=[];for(let r=0;r<2;r++){const radius=base*(.24+r*.22)*rand(.9,1.12),start=rand(0,Math.PI*2),arc=rand(Math.PI*.7,Math.PI*1.45),pts=[];const n=14;for(let i=0;i<=n;i++){const a=start+arc*(i/n)+rand(-.035,.035),rr=radius*rand(.94,1.06);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}rings.push({pts,w:.5,alpha:.42});}
return {x,y,level:1,base,segments,rings,hole:0};}
function nearest(x,y){let best=null,bd=70;for(const h of impacts){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best;}
function intensify(h){h.level++;h.hole=clamp(h.hole+rand(2.5,5.5),0,18);const extra=3+Math.floor(h.level/2);for(let i=0;i<extra;i++){const a=rand(0,Math.PI*2),startR=rand(5,22),sx=h.x+Math.cos(a)*startR,sy=h.y+Math.sin(a)*startR;h.segments.push({pts:polyline(sx,sy,a+rand(-.22,.22),h.base*rand(.55,1.05),.16),w:rand(.45,.9),alpha:rand(.55,.82)});}if(h.level%2===0){const radius=h.base*rand(.38,.68),pts=[],start=rand(0,Math.PI*2),arc=rand(Math.PI*.8,Math.PI*1.6);for(let i=0;i<=16;i++){const a=start+arc*i/16+rand(-.03,.03),rr=radius*rand(.95,1.05);pts.push([h.x+Math.cos(a)*rr,h.y+Math.sin(a)*rr]);}h.rings.push({pts,w:.45,alpha:.36});}}
function strokePath(o){const p=o.pts;if(p.length<2)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=`rgba(225,245,252,${o.alpha})`;ctx.lineWidth=o.w;ctx.shadowColor='rgba(190,230,245,.3)';ctx.shadowBlur=.6;ctx.stroke();}
function drawImpact(h){ctx.save();ctx.lineCap='butt';ctx.lineJoin='miter';for(const s of h.rings)strokePath(s);for(const s of h.segments)strokePath(s);ctx.shadowBlur=0;ctx.beginPath();ctx.arc(h.x,h.y,2.2+h.level*.45,0,Math.PI*2);ctx.fillStyle='rgba(244,252,255,.88)';ctx.fill();if(h.hole>0){ctx.beginPath();const n=10;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,r=h.hole*rand(.75,1.15),px=h.x+Math.cos(a)*r,py=h.y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle='rgba(5,11,20,.66)';ctx.fill();ctx.strokeStyle='rgba(230,248,255,.7)';ctx.lineWidth=.8;ctx.stroke();}ctx.restore();}
function spawnShards(x,y,n=8){for(let i=0;i<n;i++)particles.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-3.6,3.6),vy:rand(-5.8,-1),g:rand(.18,.28),r:rand(3,10),rot:rand(0,6),vr:rand(-.2,.2),a:1});}
function drawParticles(){for(const p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.6,p.r*.45);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.65,p.r*.5);ctx.closePath();ctx.fillStyle=`rgba(190,230,245,${p.a*.22})`;ctx.strokeStyle=`rgba(240,252,255,${p.a*.72})`;ctx.lineWidth=.65;ctx.fill();ctx.stroke();ctx.restore();}}
function draw(){ctx.clearRect(0,0,W,H);for(const h of impacts)drawImpact(h);drawParticles();}
function animate(){if(particles.length){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.015}particles=particles.filter(p=>p.a>0&&p.y<H+40);draw()}requestAnimationFrame(animate)}
function ping(strength=.8){if(!soundOn)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(rand(1250,1850),now);o.frequency.exponentialRampToValueAtTime(rand(170,260),now+.055);f.type='highpass';f.frequency.value=700;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08*strength,now+.002);g.gain.exponentialRampToValueAtTime(.0001,now+.07);o.connect(f).connect(g).connect(audio.destination);o.start(now);o.stop(now+.08);}
function boom(){if(!soundOn)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const src=audio.createBufferSource(),buf=audio.createBuffer(1,audio.sampleRate*.34,audio.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);src.buffer=buf;const g=audio.createGain();g.gain.value=.22;src.connect(g).connect(audio.destination);src.start();}
function updateDamage(add){damage=Math.min(100,damage+add);fill.style.width=damage+'%';pct.textContent=Math.round(damage)+'%';if(damage>=100&&!dead)shatterAll();}
function shatterAll(){dead=true;boom();navigator.vibrate?.([20,25,40]);flash.animate([{opacity:.55},{opacity:0}],{duration:180});for(let i=0;i<7;i++)spawnShards(rand(0,W),rand(H*.2,H*.78),14);destroyed.classList.add('show');}
function impact(x,y){if(dead)return;hint.classList.add('hide');let h=nearest(x,y),repeat=!!h;if(h){intensify(h)}else{h=makeImpact(x,y);impacts.push(h)}ping(repeat?1:.75);navigator.vibrate?.(repeat?12:8);flash.animate([{opacity:.11},{opacity:0}],{duration:75});spawnShards(x,y,repeat?6:3);updateDamage(repeat?5:8);draw();}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{impacts=[];particles=[];damage=0;dead=false;fill.style.width='0%';pct.textContent='0%';destroyed.classList.remove('show');hint.classList.remove('hide');draw();ping(.4)};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};resize();animate();
</script>
</body>
</html>
