<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08111f"><title>Shatter Glass</title><style>
:root{--text:#f7fbff;--muted:#a7bbcf;--accent:#8de7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353 0,#091727 46%,#050a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid #ffffff1f;border-radius:999px;background:#ffffff0a}.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid #ffffff26;background:linear-gradient(145deg,#b7e4ff24,#ffffff08);box-shadow:inset 0 0 70px #a0dcff0d,0 24px 70px #0000005c;transition:background .18s}.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 35%,#ffffff1c 46%,transparent 57%);pointer-events:none;transition:opacity .18s}.stage.gone{background:#04091038}.stage.gone:before{opacity:0}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0;transform:translateY(-46%) scale(.97)}.flash{position:absolute;inset:0;background:#eaf8ff;opacity:0;pointer-events:none;z-index:5}.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:#ffffff14;border:1px solid #ffffff1a}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);box-shadow:0 0 18px #7ce2ffa6;transition:width .16s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px #ffffff14}button.primary{background:#eefbff;color:#07111f}.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.22s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:#050b14b8;backdrop-filter:blur(12px);border:1px solid #ffffff29;box-shadow:0 18px 60px #00000073}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style></head><body><div class="wrap"><div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Every hit fractures differently.</small></div><div class="flash" id="flash"></div><div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div><div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div></div><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage'),fill=$('fill'),pct=$('pct'),hint=$('hint'),flash=$('flash'),destroyed=$('destroyed'),resetBtn=$('resetBtn'),soundBtn=$('soundBtn');let W=0,H=0,dpr=1,impacts=[],chips=[],pane=[],dead=false,breaking=false,soundOn=true,audio=null,animating=false;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();if(!dead)updateDamage()}addEventListener('resize',resize);
function path(x,y,a,len,rough){const p=[[x,y]];let cx=x,cy=y,ang=a,steps=Math.max(3,Math.floor(len/R(12,22)));for(let i=0;i<steps;i++){ang+=R(-rough,rough);let s=len/steps*R(.55,1.35);cx+=Math.cos(ang)*s;cy+=Math.sin(ang)*s;p.push([cx,cy]);if(cx<-30||cy<-30||cx>W+30||cy>H+30)break}return p}
function ring(x,y,r){let start=R(0,6.28),arc=R(.5,4.5),n=Math.floor(R(7,18)),p=[];for(let i=0;i<=n;i++){let a=start+arc*i/n+R(-.05,.05),rr=r*R(.82,1.18);p.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}return {p,w:R(.25,.5),a:R(.12,.3)}}
function newImpact(x,y){let type=Math.floor(R(0,5)),spokes=[6,15,9,4,11][type]+Math.floor(R(-2,3)),rad=Math.min(W,H)*R(type===3?.18:.09,type===3?.28:.19),segs=[],rings=[];let rot=R(0,6.28);for(let i=0;i<spokes;i++){let a=type===3?rot+i*R(.75,1.5)+R(-.25,.25):rot+6.28*i/spokes+R(-.25,.25),len=rad*R(Math.random()<.22?1.2:.5,Math.random()<.22?2.0:1.18),p=path(x,y,a,len,R(.07,.23));segs.push({p,w:R(.28,.7),a:R(.35,.72)});if(p.length>3&&Math.random()<.62){let j=Math.floor(R(1,p.length-1)),q=p[j],ba=a+R(-1.3,1.3);segs.push({p:path(q[0],q[1],ba,len*R(.12,.42),R(.12,.28)),w:R(.2,.46),a:R(.2,.45)})}}for(let i=0;i<(type===4?Math.floor(R(2,5)):Math.floor(R(0,3)));i++)rings.push(ring(x,y,rad*R(.15,.78)));return{x,y,level:1,rad,segs,rings}}
function nearest(x,y){let b=null,d=60;for(const h of impacts){let q=Math.hypot(h.x-x,h.y-y);if(q<d){d=q;b=h}}return b}
function deepen(h){h.level=Math.min(7,h.level+1);for(let i=0;i<Math.floor(R(2,5))+h.level;i++){let a=R(0,6.28),sr=R(0,20),sx=h.x+Math.cos(a)*sr,sy=h.y+Math.sin(a)*sr;h.segs.push({p:path(sx,sy,a+R(-.45,.45),h.rad*R(.22,1.0),R(.1,.25)),w:R(.2,.52),a:R(.24,.55)})}if(Math.random()<.55)h.rings.push(ring(h.x,h.y,h.rad*R(.3,.92)));if(h.level>=5&&Math.random()<.28)spawnChip(h.x+R(-8,8),h.y+R(-8,8))}
function stroke(o){if(o.p.length<2)return;ctx.beginPath();ctx.moveTo(...o.p[0]);for(let i=1;i<o.p.length;i++)ctx.lineTo(...o.p[i]);ctx.strokeStyle=`rgba(225,242,249,${o.a})`;ctx.lineWidth=o.w;ctx.lineJoin='miter';ctx.lineCap='butt';ctx.stroke()}
function drawImpact(h){for(const r of h.rings)stroke(r);for(const s of h.segs)stroke(s);ctx.beginPath();ctx.arc(h.x,h.y,R(.7,1.4),0,6.28);ctx.fillStyle='rgba(238,249,253,.62)';ctx.fill()}
function spawnChip(x,y){chips.push({x,y,vx:R(-2.2,2.2),vy:R(-4,-1),g:R(.14,.22),r:R(2,6),rot:R(0,6.28),vr:R(-.18,.18),a:1});startAnim()}
function drawChip(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.7,p.r*.55);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.8,p.r*.4);ctx.closePath();ctx.fillStyle=`rgba(180,220,236,${p.a*.13})`;ctx.strokeStyle=`rgba(235,249,255,${p.a*.58})`;ctx.lineWidth=.5;ctx.fill();ctx.stroke();ctx.restore()}
function damage(){let cols=12,rows=18,cw=W/cols,ch=H/rows,set=new Set(),depth=0;for(const h of impacts){let e=h.rad*(.68+h.level*.12);for(let r=Math.max(0,Math.floor((h.y-e)/ch));r<=Math.min(rows-1,Math.floor((h.y+e)/ch));r++)for(let c=Math.max(0,Math.floor((h.x-e)/cw));c<=Math.min(cols-1,Math.floor((h.x+e)/cw));c++){let x=(c+.5)*cw,y=(r+.5)*ch;if(Math.hypot(x-h.x,y-h.y)<e)set.add(r*cols+c)}depth+=Math.min(2.2,h.level*.32)}return C(set.size/(cols*rows)*78+depth,0,100)}
function updateDamage(){let d=Math.round(damage());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96&&!dead&&!breaking)beginShatter()}
function ac(){audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function noiseBurst(duration,high,low,gain,delay=0){if(!soundOn)return;let A=ac(),now=A.currentTime+delay,n=Math.floor(A.sampleRate*duration),b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){let t=i/n,env=Math.pow(1-t,3.2);d[i]=(Math.random()*2-1)*env}let s=A.createBufferSource(),hp=A.createBiquadFilter(),lp=A.createBiquadFilter(),g=A.createGain();s.buffer=b;hp.type='highpass';hp.frequency.value=high;lp.type='lowpass';lp.frequency.value=low;g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);s.connect(hp).connect(lp).connect(g).connect(A.destination);s.start(now)}
function resonance(freq,gain,dur,delay=0){if(!soundOn)return;let A=ac(),now=A.currentTime+delay,o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*R(.88,.96),now+dur);g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(A.destination);o.start(now);o.stop(now+dur)}
function tapSound(level){if(!soundOn)return;let fresh=level<=1;noiseBurst(fresh?.07:.055,1500,7000,fresh?.08:.11);resonance(R(fresh?1700:1200,fresh?2900:2200),fresh?.035:.018,fresh?.09:.05);if(level>=4&&Math.random()<.5){noiseBurst(.12,2200,9000,.055,.018);resonance(R(2600,4200),.018,.08,.02)}}
function collapseSound(){if(!soundOn)return;noiseBurst(.62,650,10000,.28);noiseBurst(.35,1800,12000,.16,.035);for(let i=0;i<8;i++){let d=R(.03,.38);resonance(R(1800,5200),R(.007,.02),R(.04,.11),d);noiseBurst(R(.025,.06),2300,12000,R(.018,.045),d)}}
function buildPane(){pane=[];let seeds=[];for(let i=0;i<32;i++)seeds.push({x:R(0,W),y:R(0,H),r:R(18,62)});for(let i=0;i<seeds.length;i++){let s=seeds[i],n=Math.floor(R(3,7)),pts=[];for(let k=0;k<n;k++){let a=6.28*k/n+R(-.45,.45),rr=s.r*R(.55,1.45);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}pane.push({x:s.x,y:s.y,pts,vx:(s.x-W/2)/W*R(1.5,5)+R(-1.2,1.2),vy:R(-2.8,.4),g:R(.12,.22),rot:0,vr:R(-.06,.06),a:1,delay:R(0,.24),gl:R(.05,.16)})}}
function drawPane(){for(const s of pane){if(s.wait)return;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.beginPath();ctx.moveTo(...s.pts[0]);for(let i=1;i<s.pts.length;i++)ctx.lineTo(...s.pts[i]);ctx.closePath();ctx.fillStyle=`rgba(185,223,238,${s.a*s.gl})`;ctx.strokeStyle=`rgba(231,247,253,${s.a*.5})`;ctx.lineWidth=.65;ctx.fill();ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);if(!dead){for(const h of impacts)drawImpact(h)}else drawPane();for(const p of chips)drawChip(p)}
function startAnim(){if(animating)return;animating=true;requestAnimationFrame(loop)}
function loop(){let active=false;for(const p of chips){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.018;if(p.a>0&&p.y<H+40)active=true}chips=chips.filter(p=>p.a>0&&p.y<H+40);if(dead){for(const s of pane){if(s.wait){s.delay-=.016;if(s.delay<=0)s.wait=false;active=true;continue}s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;s.rot+=s.vr;s.a-=.004;if(s.a>0&&s.y<H+260)active=true}pane=pane.filter(s=>s.a>0&&s.y<H+260)}draw();if(active)requestAnimationFrame(loop);else animating=false}
function beginShatter(){breaking=true;fill.style.width='100%';pct.textContent='100%';flash.animate([{opacity:.18},{opacity:0}],{duration:90});navigator.vibrate?.([12,35,28]);setTimeout(()=>{dead=true;breaking=false;buildPane();for(const s of pane)s.wait=true;stage.classList.add('gone');collapseSound();startAnim();setTimeout(()=>destroyed.classList.add('show'),650)},110)}
function hit(x,y){if(dead||breaking)return;hint.classList.add('hide');let h=nearest(x,y);if(h)deepen(h);else{h=newImpact(x,y);impacts.push(h)}tapSound(h.level);navigator.vibrate?.(h.level>2?10:6);flash.animate([{opacity:.055},{opacity:0}],{duration:55});if(h.level>=4&&Math.random()<.34)spawnChip(x,y);draw();updateDamage()}
stage.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)});resetBtn.onclick=()=>{impacts=[];chips=[];pane=[];dead=false;breaking=false;destroyed.classList.remove('show');hint.classList.remove('hide');stage.classList.remove('gone');fill.style.width='0%';pct.textContent='0%';draw()};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};resize();
</script></body></html>
