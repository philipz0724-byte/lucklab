<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070b12" />
<title>Destroy a Phone</title>
<style>
:root{--bg:#070b12;--text:#f7fbff;--muted:#9eacbd;--accent:#ff776f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 12%,#1d2634 0,#0b111b 48%,#05080d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04)}
.stage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.055),rgba(255,255,255,.012) 48%,rgba(0,0,0,.08) 100%);box-shadow:0 28px 80px rgba(0,0,0,.42)}
canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none;z-index:3;transition:.2s}.hint strong{display:block;font-size:26px;letter-spacing:.03em}.hint small{display:block;margin-top:6px;color:#aeb9c7}.hint.hide{opacity:0;transform:translateY(-6px)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff786d,#ffd5cf);box-shadow:0 0 18px rgba(255,105,95,.48);transition:width .16s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#171f2b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}button.primary{background:#fff;color:#0b0f15}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">DESTROY <span>A PHONE</span></div><div class="badge" id="countBadge">Destroyed: 0</div></div>
  <div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint"><strong>MAKE IT UNUSABLE</strong><small>Tap the screen, camera, edges — anywhere.</small></div><div class="flash" id="flash"></div></div>
  <div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">NEW PHONE</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn'),countBadge=document.getElementById('countBadge');
let W=0,H=0,dpr=1,audio=null,soundOn=true,dead=false,destroyedCount=0,animating=false,replaceTimer=null;
let phone={}; const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);layoutPhone();draw();}
addEventListener('resize',resize);
function layoutPhone(){const ph=Math.min(H*.70,620),pw=Math.min(W*.72,ph*.49);phone.x=(W-pw)/2;phone.y=(H-ph)/2+16;phone.w=pw;phone.h=ph;phone.r=Math.min(38,pw*.11);if(!phone.impacts)resetState(false)}
function resetState(redraw=true){clearTimeout(replaceTimer);dead=false;phone.impacts=[];phone.oled=[];phone.deadPixels=[];phone.edgeDents=[];phone.cameraHits=[0,0,0];phone.screenHits=0;phone.frameHits=0;phone.damage=0;phone.fade=1;hint.classList.remove('hide');fill.style.width='0%';pct.textContent='0%';if(redraw)draw()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function screenRect(){const m=phone.w*.055;return{x:phone.x+m,y:phone.y+m,w:phone.w-2*m,h:phone.h-2*m,r:phone.r*.8}}
function pointInScreen(x,y){const s=screenRect();return x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h}
function cameraCenters(){const s=screenRect(),cy=s.y+s.h*.075;return[[s.x+s.w*.38,cy],[s.x+s.w*.5,cy],[s.x+s.w*.62,cy]]}
function nearestCamera(x,y){const cs=cameraCenters();let bi=-1,bd=22;cs.forEach((c,i)=>{const d=Math.hypot(x-c[0],y-c[1]);if(d<bd){bd=d;bi=i}});return bi}
function nearFrame(x,y){const s=screenRect();if(x<phone.x||x>phone.x+phone.w||y<phone.y||y>phone.y+phone.h)return false;return !(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)}
function makeCrack(x,y,intensity=1){const spokes=Math.floor(rand(4,10)+intensity*2),radius=rand(34,72)*intensity,segments=[];for(let i=0;i<spokes;i++){let a=rand(0,Math.PI*2),cx=x,cy=y,pts=[[x,y]],steps=Math.floor(rand(3,7));for(let j=0;j<steps;j++){a+=rand(-.22,.22);const len=radius/steps*rand(.7,1.35);cx+=Math.cos(a)*len;cy+=Math.sin(a)*len;pts.push([cx,cy])}segments.push(pts)}return {x,y,segments,life:1}}
function addOLED(x,y,severity){phone.oled.push({x,y,r:rand(16,30)*severity,a:rand(.45,.78),hue:rand(250,330)});if(severity>1.2&&Math.random()<.7)phone.deadPixels.push({x:x+rand(-20,20),y:y+rand(-20,20),w:rand(10,28),h:rand(18,52),a:rand(.35,.75)})}
function updateDamage(){let covered=0;for(const h of phone.impacts)covered+=Math.min(8,2+h.segments.length*.42);covered+=phone.oled.length*3.4+phone.deadPixels.length*2.8+phone.frameHits*2.4+phone.cameraHits.reduce((a,b)=>a+b,0)*3.2;phone.damage=clamp(covered,0,100);fill.style.width=phone.damage+'%';pct.textContent=Math.round(phone.damage)+'%';if(phone.damage>=96&&!dead)destroyPhone()}
function drawPhone(){const s=screenRect();ctx.save();ctx.globalAlpha=phone.fade;
ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=28;ctx.shadowOffsetY=18;rr(phone.x,phone.y,phone.w,phone.h,phone.r);ctx.fillStyle='#171a1f';ctx.fill();ctx.shadowBlur=0;
const g=ctx.createLinearGradient(phone.x,phone.y,phone.x+phone.w,phone.y+phone.h);g.addColorStop(0,'#30353d');g.addColorStop(.4,'#15181d');g.addColorStop(1,'#292d34');rr(phone.x+2,phone.y+2,phone.w-4,phone.h-4,phone.r-2);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.stroke();
rr(s.x,s.y,s.w,s.h,s.r);const sg=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);sg.addColorStop(0,'#0c1830');sg.addColorStop(.45,'#111827');sg.addColorStop(1,'#090c14');ctx.fillStyle=sg;ctx.fill();
// wallpaper glow
const rg=ctx.createRadialGradient(s.x+s.w*.5,s.y+s.h*.4,10,s.x+s.w*.5,s.y+s.h*.4,s.w*.75);rg.addColorStop(0,'rgba(86,123,255,.28)');rg.addColorStop(.55,'rgba(154,77,255,.12)');rg.addColorStop(1,'rgba(0,0,0,0)');rr(s.x,s.y,s.w,s.h,s.r);ctx.fillStyle=rg;ctx.fill();
// cameras / island
ctx.fillStyle='rgba(0,0,0,.88)';rr(s.x+s.w*.31,s.y+s.h*.035,s.w*.38,s.h*.075,s.h*.035);ctx.fill();cameraCenters().forEach((c,i)=>{ctx.beginPath();ctx.arc(c[0],c[1],6.2,0,Math.PI*2);ctx.fillStyle=phone.cameraHits[i]>2?'#060606':'#101217';ctx.fill();ctx.strokeStyle=phone.cameraHits[i]?'rgba(255,90,80,.7)':'rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();if(phone.cameraHits[i]){ctx.beginPath();ctx.moveTo(c[0]-8,c[1]-5);ctx.lineTo(c[0]+7,c[1]+6);ctx.strokeStyle='rgba(235,245,255,.7)';ctx.stroke()}})
// OLED damage
for(const o of phone.oled){const gg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);gg.addColorStop(0,`hsla(${o.hue},90%,65%,${o.a})`);gg.addColorStop(.45,`hsla(${o.hue+60},90%,55%,${o.a*.45})`);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}
for(const p of phone.deadPixels){ctx.fillStyle=`rgba(0,0,0,${p.a})`;ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);ctx.fillStyle=`rgba(255,255,255,${p.a*.12})`;ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,1)}
// cracks
ctx.lineCap='butt';ctx.lineJoin='miter';for(const h of phone.impacts){for(const pts of h.segments){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.strokeStyle='rgba(232,243,250,.72)';ctx.lineWidth=.55;ctx.stroke()}ctx.beginPath();ctx.arc(h.x,h.y,1.4,0,Math.PI*2);ctx.fillStyle='rgba(245,250,255,.8)';ctx.fill()}
// frame dents
for(const d of phone.edgeDents){ctx.beginPath();ctx.ellipse(d.x,d.y,d.rx,d.ry,d.rot,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.36)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=.7;ctx.stroke()}
ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawPhone()}
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function noiseHit(level=.05,high=1400,dur=.05){if(!soundOn)return;const ac=ensureAudio(),len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;hp.type='highpass';hp.frequency.value=high;g.gain.value=level;s.connect(hp).connect(g).connect(ac.destination);s.start()}
function screenSound(cracked=false){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime;[cracked?1700:2200,cracked?2800:3400].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*rand(.94,1.06);g.gain.setValueAtTime(.022/(i+1),now);g.gain.exponentialRampToValueAtTime(.0001,now+(cracked?.045:.075));o.connect(g).connect(ac.destination);o.start();o.stop(now+.09)});noiseHit(cracked?.06:.04,cracked?1500:1900,cracked?.055:.04)}
function metalSound(){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(rand(430,680),now);o.frequency.exponentialRampToValueAtTime(rand(120,180),now+.06);g.gain.setValueAtTime(.05,now);g.gain.exponentialRampToValueAtTime(.0001,now+.09);o.connect(g).connect(ac.destination);o.start();o.stop(now+.1);noiseHit(.045,700,.05)}
function cameraSound(){if(!soundOn)return;noiseHit(.07,1700,.045)}
function destroySound(){if(!soundOn)return;noiseHit(.18,500,.35);const ac=ensureAudio();for(let i=0;i<6;i++)setTimeout(()=>screenSound(true),i*35)}
function impact(x,y){if(dead)return;hint.classList.add('hide');const cam=nearestCamera(x,y);if(cam>=0){phone.cameraHits[cam]++;cameraSound();phone.frameHits+=.35;phone.edgeDents.push({x,y,rx:rand(5,9),ry:rand(2,5),rot:rand(-.5,.5)})}
else if(pointInScreen(x,y)){const nearby=phone.impacts.some(h=>Math.hypot(h.x-x,h.y-y)<22);phone.impacts.push(makeCrack(x,y,nearby?1.15:1));phone.screenHits++;screenSound(nearby||phone.screenHits>4);if(phone.screenHits>3&&Math.random()<.55)addOLED(x,y,rand(.8,1.45));if(phone.screenHits>7&&Math.random()<.35)phone.deadPixels.push({x:x+rand(-24,24),y:y+rand(-24,24),w:rand(8,24),h:rand(20,70),a:rand(.35,.7)})}
else if(nearFrame(x,y)){phone.frameHits++;metalSound();phone.edgeDents.push({x,y,rx:rand(7,15),ry:rand(2,6),rot:rand(-.7,.7)})}
else return;
navigator.vibrate?.(7);flash.animate([{opacity:.055},{opacity:0}],{duration:55});updateDamage();draw()}
function destroyPhone(){dead=true;fill.style.width='100%';pct.textContent='100%';destroySound();navigator.vibrate?.([15,20,35]);const start=performance.now();function fall(t){const p=Math.min(1,(t-start)/700);phone.fade=1-p*.9;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(0,p*p*H*.35);ctx.rotate((p*.05)*Math.sin(p*5));drawPhone();ctx.restore();if(p<1)requestAnimationFrame(fall);else{destroyedCount++;countBadge.textContent='Destroyed: '+destroyedCount;replaceTimer=setTimeout(()=>{resetState(false);phone.fade=0;const t0=performance.now();function appear(t2){const q=Math.min(1,(t2-t0)/260);phone.fade=q;draw();if(q<1)requestAnimationFrame(appear)}requestAnimationFrame(appear)},420)}}requestAnimationFrame(fall)}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{resetState();screenSound(false)};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};
resize();
</script>
</body>
</html>
