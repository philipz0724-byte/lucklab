<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08111f" />
<title>Shatter Glass</title>
<style>
:root{--text:#f7fbff;--muted:#a7bbcf;--accent:#8de7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353 0,#091727 46%,#050a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04)}
.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(183,228,255,.14),rgba(255,255,255,.025));box-shadow:inset 0 0 70px rgba(160,220,255,.05),0 24px 70px rgba(0,0,0,.36)}
.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.11) 46%,transparent 57%);pointer-events:none}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.035),transparent 34%);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0;transform:translateY(-46%) scale(.97)}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:5}
.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);box-shadow:0 0 18px rgba(124,226,255,.65);transition:width .18s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}button.primary{background:#eefbff;color:#07111f}
.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.22s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 60px rgba(0,0,0,.45)}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Hit the same spot to deepen the damage.</small></div>
    <div class="flash" id="flash"></div>
    <div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div>
  </div>
  <div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,impacts=[],particles=[],dead=false,soundOn=true,audio=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();updateDamage();}
addEventListener('resize',resize);
function jaggedPath(x,y,angle,len,rough=.1){const pts=[[x,y]];let cx=x,cy=y,a=angle;const steps=Math.max(5,Math.floor(len/13));for(let i=0;i<steps;i++){a+=rand(-rough,rough);const s=len/steps*rand(.82,1.18);cx+=Math.cos(a)*s;cy+=Math.sin(a)*s;pts.push([cx,cy]);if(cx<-20||cy<-20||cx>W+20||cy>H+20)break}return pts}
function makeImpact(x,y){const spokes=Math.floor(rand(9,14)),radius=Math.min(W,H)*rand(.11,.16),segments=[],rings=[];for(let i=0;i<spokes;i++){const angle=(Math.PI*2/spokes)*i+rand(-.11,.11);const pts=jaggedPath(x,y,angle,radius*rand(.7,1.2),.085);segments.push({pts,w:rand(.45,.95),a:rand(.62,.9)});if(pts.length>4&&Math.random()<.7){const j=Math.floor(rand(2,pts.length-1)),p=pts[j],branchAngle=angle+rand(-.8,.8);segments.push({pts:jaggedPath(p[0],p[1],branchAngle,radius*rand(.2,.42),.12),w:rand(.35,.65),a:rand(.35,.6)})}}
for(let r=0;r<2;r++){const rr=radius*(.22+r*.18)*rand(.9,1.08),start=rand(0,Math.PI*2),arc=rand(Math.PI*.8,Math.PI*1.5),pts=[];for(let i=0;i<=18;i++){const a=start+arc*i/18+rand(-.02,.02),jitter=rr*rand(.96,1.04);pts.push([x+Math.cos(a)*jitter,y+Math.sin(a)*jitter])}rings.push({pts,w:.4,a:.3})}
return {x,y,level:1,radius,segments,rings,hole:0};}
function nearest(x,y){let best=null,bd=58;for(const h of impacts){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
function intensify(h){h.level=Math.min(6,h.level+1);h.hole=clamp(h.hole+rand(2,4.5),0,20);for(let i=0;i<2+h.level;i++){const a=rand(0,Math.PI*2),sr=rand(3,18),sx=h.x+Math.cos(a)*sr,sy=h.y+Math.sin(a)*sr;h.segments.push({pts:jaggedPath(sx,sy,a+rand(-.18,.18),h.radius*rand(.45,.9),.1),w:rand(.35,.75),a:rand(.45,.72)})}if(h.level%2===0){const rr=h.radius*rand(.42,.7),start=rand(0,Math.PI*2),arc=rand(Math.PI*.8,Math.PI*1.4),pts=[];for(let i=0;i<=18;i++){const a=start+arc*i/18+rand(-.02,.02),r=rr*rand(.97,1.03);pts.push([h.x+Math.cos(a)*r,h.y+Math.sin(a)*r])}h.rings.push({pts,w:.38,a:.28})}}
function stroke(o){const p=o.pts;if(p.length<2)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=`rgba(229,245,250,${o.a})`;ctx.lineWidth=o.w;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.stroke()}
function drawImpact(h){ctx.save();for(const r of h.rings)stroke(r);for(const s of h.segments)stroke(s);ctx.beginPath();ctx.arc(h.x,h.y,2+h.level*.35,0,Math.PI*2);ctx.fillStyle='rgba(244,252,255,.88)';ctx.fill();if(h.hole>0){ctx.beginPath();const n=11;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,rr=h.hole*rand(.78,1.12),px=h.x+Math.cos(a)*rr,py=h.y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle='rgba(4,9,16,.72)';ctx.fill();ctx.strokeStyle='rgba(236,249,255,.6)';ctx.lineWidth=.7;ctx.stroke()}ctx.restore()}
function spawnShards(x,y,n=7){for(let i=0;i<n;i++)particles.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-3.2,3.2),vy:rand(-5.4,-1.2),g:rand(.18,.27),r:rand(3,9),rot:rand(0,6),vr:rand(-.2,.2),a:1})}
function drawParticles(){for(const p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.55,p.r*.45);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.62,p.r*.48);ctx.closePath();ctx.fillStyle=`rgba(185,225,240,${p.a*.18})`;ctx.strokeStyle=`rgba(240,252,255,${p.a*.7})`;ctx.lineWidth=.6;ctx.fill();ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);for(const h of impacts)drawImpact(h);drawParticles()}
function animate(){if(particles.length){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.015}particles=particles.filter(p=>p.a>0&&p.y<H+40);draw()}requestAnimationFrame(animate)}
function coverageDamage(){if(!W||!H)return 0;const cols=10,rows=16,cellW=W/cols,cellH=H/rows,covered=new Set();for(const h of impacts){const eff=h.radius*(.85+h.level*.11);const minC=Math.max(0,Math.floor((h.x-eff)/cellW)),maxC=Math.min(cols-1,Math.floor((h.x+eff)/cellW)),minR=Math.max(0,Math.floor((h.y-eff)/cellH)),maxR=Math.min(rows-1,Math.floor((h.y+eff)/cellH));for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){const cx=(c+.5)*cellW,cy=(r+.5)*cellH;if(Math.hypot(cx-h.x,cy-h.y)<=eff)covered.add(r*cols+c)}}const areaPart=covered.size/(cols*rows)*72;let fracturePart=0;for(const h of impacts)fracturePart+=Math.min(4,h.level*.65)+Math.min(2.5,h.hole/8);return clamp(areaPart+fracturePart,0,100)}
function updateDamage(){const d=Math.round(coverageDamage());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96&&!dead)shatterAll()}
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function glassTap(strength=1){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime;
const osc=ac.createOscillator(),gain=ac.createGain(),bp=ac.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(rand(2500,3600),now);osc.frequency.exponentialRampToValueAtTime(rand(1200,1800),now+.035);bp.type='bandpass';bp.frequency.value=2900;bp.Q.value=3.2;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.08*strength,now+.0015);gain.gain.exponentialRampToValueAtTime(.0001,now+.055);osc.connect(bp).connect(gain).connect(ac.destination);osc.start(now);osc.stop(now+.065);
const len=Math.floor(ac.sampleRate*.11),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const env=Math.pow(1-i/len,3.6);d[i]=(Math.random()*2-1)*env*(i%7===0?1:.35)}const src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g2=ac.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=1800;g2.gain.value=.11*strength;src.connect(hp).connect(g2).connect(ac.destination);src.start(now+.004)}
function glassShatter(){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime,len=Math.floor(ac.sampleRate*.65),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/len,env=Math.pow(1-t,1.45);let x=(Math.random()*2-1)*env;if(i%Math.floor(rand(120,260))===0)x*=3;d[i]=x}const src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=950;g.gain.setValueAtTime(.3,now);g.gain.exponentialRampToValueAtTime(.03,now+.65);src.connect(hp).connect(g).connect(ac.destination);src.start(now);for(let k=0;k<5;k++)setTimeout(()=>glassTap(rand(.35,.65)),25+k*45)}
function shatterAll(){dead=true;fill.style.width='100%';pct.textContent='100%';glassShatter();navigator.vibrate?.([18,22,34]);flash.animate([{opacity:.46},{opacity:0}],{duration:170});for(let i=0;i<9;i++)spawnShards(rand(0,W),rand(H*.18,H*.82),14);destroyed.classList.add('show')}
function impact(x,y){if(dead)return;hint.classList.add('hide');let h=nearest(x,y),repeat=!!h;if(h)intensify(h);else{h=makeImpact(x,y);impacts.push(h)}glassTap(repeat?1.05:.78);navigator.vibrate?.(repeat?11:7);flash.animate([{opacity:.08},{opacity:0}],{duration:65});spawnShards(x,y,repeat?5:2);draw();updateDamage()}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{impacts=[];particles=[];dead=false;destroyed.classList.remove('show');hint.classList.remove('hide');draw();updateDamage();glassTap(.35)};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};
resize();animate();
</script>
</body>
</html>
