<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08111f" />
<title>Shatter Glass</title>
<style>
:root{--text:#f7fbff;--muted:#a7bbcf;--accent:#8de7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353 0,#091727 46%,#050a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04)}
.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(183,228,255,.14),rgba(255,255,255,.025));box-shadow:inset 0 0 70px rgba(160,220,255,.05),0 24px 70px rgba(0,0,0,.36);transition:background .2s}
.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.11) 46%,transparent 57%);pointer-events:none;transition:opacity .18s}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.035),transparent 34%);pointer-events:none;transition:opacity .18s}.stage.gone{background:rgba(4,9,16,.22)}.stage.gone:before,.stage.gone:after{opacity:0}
canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0;transform:translateY(-46%) scale(.97)}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:5}
.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);box-shadow:0 0 18px rgba(124,226,255,.65);transition:width .18s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}button.primary{background:#eefbff;color:#07111f}
.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.22s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 60px rgba(0,0,0,.45)}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Every impact fractures differently.</small></div>
    <div class="flash" id="flash"></div>
    <div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div>
  </div>
  <div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,impacts=[],particles=[],paneShards=[],dead=false,soundOn=true,audio=null,shatterTime=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();if(!dead)updateDamage();}
addEventListener('resize',resize);
function jaggedPath(x,y,angle,len,rough=.12,bias=0){const pts=[[x,y]];let cx=x,cy=y,a=angle;const steps=Math.max(4,Math.floor(len/rand(11,19)));for(let i=0;i<steps;i++){a+=rand(-rough,rough)+bias;const s=len/steps*rand(.65,1.3);cx+=Math.cos(a)*s;cy+=Math.sin(a)*s;pts.push([cx,cy]);if(cx<-25||cy<-25||cx>W+25||cy>H+25)break}return pts}
function makeRing(x,y,radius,alpha=.3){const start=rand(0,Math.PI*2),arc=rand(Math.PI*.35,Math.PI*1.7),pts=[],n=Math.floor(rand(8,20));for(let i=0;i<=n;i++){const a=start+arc*i/n+rand(-.05,.05),rr=radius*rand(.86,1.14);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}return {pts,w:rand(.3,.62),a:alpha}}
function makeImpact(x,y){const type=Math.floor(rand(0,5)),segments=[],rings=[];let spokes,radius,spread;
if(type===0){spokes=Math.floor(rand(5,9));radius=Math.min(W,H)*rand(.15,.24);spread=.24}
else if(type===1){spokes=Math.floor(rand(12,19));radius=Math.min(W,H)*rand(.08,.14);spread=.10}
else if(type===2){spokes=Math.floor(rand(7,12));radius=Math.min(W,H)*rand(.12,.2);spread=.18}
else if(type===3){spokes=Math.floor(rand(3,6));radius=Math.min(W,H)*rand(.19,.29);spread=.28}
else{spokes=Math.floor(rand(8,14));radius=Math.min(W,H)*rand(.1,.17);spread=.15}
const rotation=rand(0,Math.PI*2);
for(let i=0;i<spokes;i++){
  let angle;
  if(type===3) angle=rotation+i*rand(.65,1.45)+rand(-.18,.18);
  else angle=rotation+(Math.PI*2/spokes)*i+rand(-spread,spread);
  const longChance=Math.random()<.2, len=radius*rand(longChance?1.3:.55,longChance?2.05:1.25);
  const pts=jaggedPath(x,y,angle,len,rand(.06,.2),rand(-.008,.008));
  segments.push({pts,w:rand(.35,1.15),a:rand(.5,.94)});
  const branches=Math.random()<.35?2:(Math.random()<.7?1:0);
  for(let b=0;b<branches;b++) if(pts.length>3){const j=Math.floor(rand(1,pts.length-1)),p=pts[j],ba=angle+rand(-1.25,1.25);segments.push({pts:jaggedPath(p[0],p[1],ba,len*rand(.12,.48),rand(.1,.25)),w:rand(.28,.7),a:rand(.28,.62)})}
}
const ringCount=type===4?Math.floor(rand(3,6)):Math.floor(rand(0,4));for(let r=0;r<ringCount;r++)rings.push(makeRing(x,y,radius*rand(.16,.78),rand(.16,.42)));
const chipSeed=[];const chipN=Math.floor(rand(8,15));for(let i=0;i<chipN;i++){const a=Math.PI*2*i/chipN+rand(-.16,.16),rr=rand(2.5,5.5);chipSeed.push([Math.cos(a)*rr,Math.sin(a)*rr])}
return {x,y,type,level:1,radius,segments,rings,hole:0,chipSeed};}
function nearest(x,y){let best=null,bd=62;for(const h of impacts){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
function intensify(h){h.level=Math.min(7,h.level+1);h.hole=clamp(h.hole+rand(1.5,4.8),0,23);const extra=Math.floor(rand(1,4))+h.level;for(let i=0;i<extra;i++){const a=rand(0,Math.PI*2),sr=rand(1,22),sx=h.x+Math.cos(a)*sr,sy=h.y+Math.sin(a)*sr;h.segments.push({pts:jaggedPath(sx,sy,a+rand(-.4,.4),h.radius*rand(.28,1.08),rand(.08,.22)),w:rand(.28,.82),a:rand(.34,.76)})}if(Math.random()<.72)h.rings.push(makeRing(h.x,h.y,h.radius*rand(.3,.9),rand(.16,.34)))}
function stroke(o){const p=o.pts;if(p.length<2)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=`rgba(229,245,250,${o.a})`;ctx.lineWidth=o.w;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.stroke()}
function drawImpact(h){ctx.save();for(const r of h.rings)stroke(r);for(const s of h.segments)stroke(s);ctx.beginPath();ctx.arc(h.x,h.y,1.5+h.level*.28,0,Math.PI*2);ctx.fillStyle='rgba(244,252,255,.82)';ctx.fill();if(h.hole>0){ctx.beginPath();h.chipSeed.forEach((q,i)=>{const rr=1+h.hole/5,px=h.x+q[0]*rr,py=h.y+q[1]*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.fillStyle='rgba(4,9,16,.78)';ctx.fill();ctx.strokeStyle='rgba(236,249,255,.55)';ctx.lineWidth=.7;ctx.stroke()}ctx.restore()}
function spawnShards(x,y,n=7){for(let i=0;i<n;i++)particles.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-3.2,3.2),vy:rand(-5.4,-1.2),g:rand(.18,.27),r:rand(3,9),rot:rand(0,6),vr:rand(-.2,.2),a:1})}
function drawParticles(){for(const p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.55,p.r*.45);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.62,p.r*.48);ctx.closePath();ctx.fillStyle=`rgba(185,225,240,${p.a*.18})`;ctx.strokeStyle=`rgba(240,252,255,${p.a*.7})`;ctx.lineWidth=.6;ctx.fill();ctx.stroke();ctx.restore()}}
function makePaneShards(){const shards=[],cols=5,rows=9,cw=W/cols,ch=H/rows;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=c*cw,y=r*ch,cx=x+cw/2,cy=y+ch/2;const jx=cw*.16,jy=ch*.16;const pts=[[-cw/2+rand(-jx,jx),-ch/2+rand(-jy,jy)],[cw/2+rand(-jx,jx),-ch/2+rand(-jy,jy)],[cw/2+rand(-jx,jx),ch/2+rand(-jy,jy)],[-cw/2+rand(-jx,jx),ch/2+rand(-jy,jy)]];const fromCenter=(cx-W/2)/(W/2);shards.push({x:cx,y:cy,pts,vx:fromCenter*rand(1.2,3.8)+rand(-1.2,1.2),vy:rand(-3.2,.8)-(1-r/rows)*1.5,g:rand(.12,.23),rot:0,vr:rand(-.055,.055),a:1,delay:rand(0,.14),glint:rand(.08,.2)})}return shards}
function drawPaneShards(){const elapsed=(performance.now()-shatterTime)/1000;for(const s of paneShards){const t=Math.max(0,elapsed-s.delay);if(t<=0)continue;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);for(let i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i][0],s.pts[i][1]);ctx.closePath();ctx.fillStyle=`rgba(190,225,240,${Math.max(0,s.a)*s.glint})`;ctx.strokeStyle=`rgba(236,249,255,${Math.max(0,s.a)*.7})`;ctx.lineWidth=.8;ctx.fill();ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);if(dead){drawPaneShards();drawParticles();return}for(const h of impacts)drawImpact(h);drawParticles()}
function animate(){if(particles.length){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.015}particles=particles.filter(p=>p.a>0&&p.y<H+40)}if(dead&&paneShards.length){for(const s of paneShards){const elapsed=(performance.now()-shatterTime)/1000;if(elapsed<s.delay)continue;s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;s.rot+=s.vr;s.a-=.0035}paneShards=paneShards.filter(s=>s.a>0&&s.y<H+260)}draw();requestAnimationFrame(animate)}
function coverageDamage(){if(!W||!H)return 0;const cols=12,rows=18,cellW=W/cols,cellH=H/rows,covered=new Set();for(const h of impacts){const eff=h.radius*(.72+h.level*.13);const minC=Math.max(0,Math.floor((h.x-eff)/cellW)),maxC=Math.min(cols-1,Math.floor((h.x+eff)/cellW)),minR=Math.max(0,Math.floor((h.y-eff)/cellH)),maxR=Math.min(rows-1,Math.floor((h.y+eff)/cellH));for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){const cx=(c+.5)*cellW,cy=(r+.5)*cellH;if(Math.hypot(cx-h.x,cy-h.y)<=eff)covered.add(r*cols+c)}}const areaPart=covered.size/(cols*rows)*78;let fracturePart=0;for(const h of impacts)fracturePart+=Math.min(3.5,h.level*.52)+Math.min(2.2,h.hole/9);return clamp(areaPart+fracturePart,0,100)}
function updateDamage(){const d=Math.round(coverageDamage());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96&&!dead)shatterAll()}
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function glassTap(strength=1){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime;const osc=ac.createOscillator(),gain=ac.createGain(),bp=ac.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(rand(2500,3900),now);osc.frequency.exponentialRampToValueAtTime(rand(1100,1800),now+.035);bp.type='bandpass';bp.frequency.value=rand(2400,3300);bp.Q.value=3.4;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.07*strength,now+.001);gain.gain.exponentialRampToValueAtTime(.0001,now+.06);osc.connect(bp).connect(gain).connect(ac.destination);osc.start(now);osc.stop(now+.07);const len=Math.floor(ac.sampleRate*.1),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const env=Math.pow(1-i/len,4);d[i]=(Math.random()*2-1)*env*(Math.random()<.08?1:.25)}const src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g2=ac.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=1700;g2.gain.value=.1*strength;src.connect(hp).connect(g2).connect(ac.destination);src.start(now+.004)}
function glassShatter(){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime,len=Math.floor(ac.sampleRate*.9),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/len,env=Math.pow(1-t,1.2);let x=(Math.random()*2-1)*env*.8;if(Math.random()<.018)x*=2.4;d[i]=x}const src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=780;g.gain.setValueAtTime(.34,now);g.gain.exponentialRampToValueAtTime(.02,now+.9);src.connect(hp).connect(g).connect(ac.destination);src.start(now);for(let k=0;k<9;k++)setTimeout(()=>glassTap(rand(.22,.52)),30+k*38)}
function shatterAll(){dead=true;fill.style.width='100%';pct.textContent='100%';glassShatter();navigator.vibrate?.([18,18,30,18,45]);flash.animate([{opacity:.7},{opacity:.15},{opacity:0}],{duration:230});paneShards=makePaneShards();shatterTime=performance.now();stage.classList.add('gone');for(let i=0;i<12;i++)spawnShards(rand(0,W),rand(H*.12,H*.88),12);setTimeout(()=>destroyed.classList.add('show'),520)}
function impact(x,y){if(dead)return;hint.classList.add('hide');let h=nearest(x,y),repeat=!!h;if(h)intensify(h);else{h=makeImpact(x,y);impacts.push(h)}glassTap(repeat?1.05:.78);navigator.vibrate?.(repeat?11:7);flash.animate([{opacity:.08},{opacity:0}],{duration:65});spawnShards(x,y,repeat?5:2);draw();updateDamage()}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{impacts=[];particles=[];paneShards=[];dead=false;stage.classList.remove('gone');destroyed.classList.remove('show');hint.classList.remove('hide');draw();updateDamage();glassTap(.35)};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};
resize();animate();
</script>
</body>
</html>
