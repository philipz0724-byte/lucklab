<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Destroy a Phone</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900}.badge{font-size:12px;opacity:.72}.stage{position:relative;flex:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 36%,#213043,#0a111b 66%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;top:8%;left:0;right:0;text-align:center;pointer-events:none;transition:.2s}.hint.hide{opacity:0}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meter{height:12px;background:#182231;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff776f,#ffd5cf);transition:width .15s}.bottom{display:flex;gap:10px}button{flex:1;padding:14px;border:0;border-radius:16px;font-weight:800}</style></head><body><div class="wrap"><div class="top"><div class="title">DESTROY A PHONE</div><div class="badge" id="count">Destroyed: 0</div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="hint" id="hint"><b>MAKE IT UNUSABLE</b><br><small>Hit the screen, cameras, frame and corners</small></div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div id="pct">0%</div></div><div class="bottom"><button id="sound">Sound: ON</button><button id="reset">NEW PHONE</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={},anim=false;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r)}
function reset(redraw=true){done=false;p.screenFaults=[];p.screenMarks=[];p.dents=[];p.cam=[0,0,0];p.cells=new Set();p.screenHits=0;p.frameHits=0;p.cornerHits=0;p.totalHits=0;p.screenOff=false;p.fade=1;p.tx=0;p.ty=0;p.vx=0;p.vy=0;p.rot=0;p.vr=0;fill.style.width='0%';pct.textContent='0%';hint.classList.remove('hide');if(redraw)draw()}
function layout(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=Math.min(H*.70,620),w=Math.min(W*.74,h*.5);p.w=w;p.h=h;p.x=(W-w)/2;p.y=(H-h)/2+14;p.r=Math.min(38,w*.11);if(!p.screenFaults)reset(false);draw()}addEventListener('resize',layout);
function screen(){let m=p.w*.06;return{x:m,y:m,w:p.w-2*m,h:p.h-2*m,r:p.r*.78}}function cams(){let s=screen(),cy=s.y+s.h*.07;return[[s.x+s.w*.39,cy],[s.x+s.w*.5,cy],[s.x+s.w*.61,cy]]}
function matrix(){let shx=p.tx*.004,shy=p.ty*.003,sx=1-Math.abs(p.ty)*.0018,sy=1-Math.abs(p.tx)*.0013;let a=sx,b=shy,c=shx,d=sy,e=p.x+p.w/2,f=p.y+p.h/2;return{a,b,c,d,e,f}}
function localToWorld(x,y){let m=matrix(),lx=x-p.w/2,ly=y-p.h/2;return{x:m.a*lx+m.c*ly+m.e,y:m.b*lx+m.d*ly+m.f}}
function worldToLocal(x,y){let m=matrix(),X=x-m.e,Y=y-m.f,det=m.a*m.d-m.b*m.c;if(!det)return{x:-999,y:-999};let lx=(m.d*X-m.c*Y)/det,ly=(-m.b*X+m.a*Y)/det;return{x:lx+p.w/2,y:ly+p.h/2}}
function applyPhoneTransform(){let m=matrix();ctx.translate(m.e,m.f);ctx.rotate(p.rot);ctx.transform(m.a,m.b,m.c,m.d,0,0);ctx.translate(-p.w/2,-p.h/2)}
function inside(lx,ly){return lx>=0&&lx<=p.w&&ly>=0&&ly<=p.h}function insideScreen(lx,ly){let s=screen();return lx>=s.x&&lx<=s.x+s.w&&ly>=s.y&&ly<=s.y+s.h}function camAt(lx,ly){let k=-1,d=20;cams().forEach((q,i)=>{let n=Math.hypot(lx-q[0],ly-q[1]);if(n<d){d=n;k=i}});return k}
function wallpaper(s){let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'#123a83');g.addColorStop(.38,'#6448d8');g.addColorStop(.72,'#d856a2');g.addColorStop(1,'#ff9f5b');ctx.fillStyle=g;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.96)';ctx.textAlign='center';ctx.font=`700 ${Math.max(18,s.w*.16)}px system-ui`;ctx.fillText('9:41',s.x+s.w/2,s.y+s.h*.25);ctx.font=`500 ${Math.max(9,s.w*.045)}px system-ui`;ctx.fillText('Saturday, August 8',s.x+s.w/2,s.y+s.h*.31)}
function addFault(x,y){let s=screen(),t=Math.floor(R(0,4));if(t===0)p.screenFaults.push({t:'bruise',x,y,r:R(18,32),h:R(220,330),a:R(.28,.5)});else if(t===1)p.screenFaults.push({t:'dead',x,y,rx:R(10,24),ry:R(18,46),rot:R(-.5,.5),a:R(.5,.85)});else if(t===2)p.screenFaults.push({t:'line',x:C(x+R(-8,8),s.x+2,s.x+s.w-2),y1:C(y-R(35,70),s.y,s.y+s.h),y2:C(y+R(35,70),s.y,s.y+s.h),h:R(150,330),a:R(.4,.75)});else p.screenMarks.push({x,y,rx:R(8,20),ry:R(3,8),rot:R(-1,1),a:R(.13,.26)})}
function drawScreenDamage(){let s=screen();ctx.save();rr(s.x,s.y,s.w,s.h,s.r);ctx.clip();if(!p.screenOff)wallpaper(s);else{ctx.fillStyle='#020305';ctx.fillRect(s.x,s.y,s.w,s.h);let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'rgba(255,255,255,.055)');g.addColorStop(.3,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.018)');ctx.fillStyle=g;ctx.fillRect(s.x,s.y,s.w,s.h)}if(!p.screenOff)for(const f of p.screenFaults){if(f.t==='bruise'){let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`hsla(${f.h},90%,62%,${f.a})`);g.addColorStop(.55,`hsla(${f.h+50},90%,55%,${f.a*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}else if(f.t==='dead'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=`rgba(0,0,0,${f.a})`;ctx.beginPath();ctx.ellipse(0,0,f.rx,f.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}else{ctx.strokeStyle=`hsla(${f.h},95%,65%,${f.a})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(f.x,f.y1);ctx.lineTo(f.x,f.y2);ctx.stroke()}}for(const m of p.screenMarks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle=`rgba(255,255,255,${m.a})`;ctx.beginPath();ctx.ellipse(0,0,m.rx,m.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}
function drawCam(q,i){let dmg=p.cam[i];ctx.beginPath();ctx.arc(q[0],q[1],7,0,Math.PI*2);ctx.fillStyle=dmg>=4?'#070707':'#11151a';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();if(dmg>0){ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],6.3,0,Math.PI*2);ctx.clip();let g=ctx.createRadialGradient(q[0]-2,q[1]-2,0,q[0],q[1],8);g.addColorStop(0,`rgba(210,225,235,${Math.min(.5,dmg*.1)})`);g.addColorStop(1,'rgba(80,90,100,.08)');ctx.fillStyle=g;ctx.fillRect(q[0]-8,q[1]-8,16,16);if(dmg>=2){ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.moveTo(q[0]+2,q[1]-7);ctx.lineTo(q[0]+7,q[1]-2);ctx.lineTo(q[0]+5,q[1]+3);ctx.closePath();ctx.fill()}if(dmg>=3){ctx.strokeStyle='rgba(230,240,245,.55)';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(q[0]-1,q[1]+1,4.5,-1.5,1.2);ctx.stroke()}ctx.restore()}}
function drawPhone(){ctx.save();applyPhoneTransform();ctx.globalAlpha=p.fade;let depth=9+Math.abs(p.tx)*.05;ctx.fillStyle='#0b0e13';rr(5+depth,7+depth,p.w,p.h,p.r);ctx.fill();let side=ctx.createLinearGradient(0,0,p.w,p.h);side.addColorStop(0,'#333941');side.addColorStop(.5,'#14171c');side.addColorStop(1,'#292e35');ctx.shadowColor='rgba(0,0,0,.68)';ctx.shadowBlur=26;ctx.shadowOffsetY=18;rr(0,0,p.w,p.h,p.r);ctx.fillStyle=side;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;rr(2,2,p.w-4,p.h-4,p.r-2);ctx.stroke();drawScreenDamage();let s=screen();ctx.fillStyle='rgba(0,0,0,.9)';rr(s.x+s.w*.31,s.y+s.h*.028,s.w*.38,s.h*.075,s.h*.035);ctx.fill();cams().forEach((q,i)=>drawCam(q,i));for(const d of p.dents){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=.5;ctx.stroke();ctx.restore()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawPhone()}
function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=800,d=.05){if(!soundOn)return;let A=audioCtx(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type='highpass';f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function hitSound(kind){if(kind==='frame')noise(.065,500,.07);else if(kind==='cam')noise(.06,1300,.05);else noise(.045,900,.055)}
function damage(){let screenCells=0;for(const k of p.cells)if(k.startsWith('s'))screenCells++;let bodyCells=p.cells.size-screenCells;let d=screenCells*3.8+bodyCells*4.2+p.cam.reduce((a,b)=>a+Math.min(b,4),0)*2.4+Math.min(18,p.totalHits*.55)+Math.min(8,p.cornerHits*1.6);d=C(d,0,100);fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=98&&!done)finish()}
function addCell(lx,ly,screenHit){let cols=5,rows=9,c=Math.floor(C(lx/p.w*cols,0,cols-1)),r=Math.floor(C(ly/p.h*rows,0,rows-1));p.cells.add((screenHit?'s':'b')+r+'-'+c)}
function kick(lx,ly){let nx=(lx/p.w-.5),ny=(ly/p.h-.5);p.vx+=nx*4.5;p.vy+=ny*4.5;p.vr+=nx*.006;startAnim()}
function startAnim(){if(anim)return;anim=true;requestAnimationFrame(step)}function step(){p.tx+=p.vx;p.ty+=p.vy;p.rot+=p.vr;p.vx+=(-p.tx*.11-p.vx*.32);p.vy+=(-p.ty*.11-p.vy*.32);p.vr+=(-p.rot*.15-p.vr*.3);draw();if(Math.abs(p.tx)+Math.abs(p.ty)+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.rot)*100>0.12&&!done)requestAnimationFrame(step);else{p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;anim=false;draw()}}
function finish(){done=true;total++;count.textContent='Destroyed: '+total;noise(.18,350,.3);navigator.vibrate?.([18,24,38]);let st=performance.now();function fall(){let t=(performance.now()-st)/850;p.fade=Math.max(0,1-t*.8);p.y+=2+t*7;p.rot+=.01;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},450)}requestAnimationFrame(fall)}
function hit(wx,wy){if(done)return;let q=worldToLocal(wx,wy),lx=q.x,ly=q.y;if(!inside(lx,ly))return;hint.classList.add('hide');p.totalHits++;let k=camAt(lx,ly),kind='screen';if(k>=0){p.cam[k]=Math.min(5,p.cam[k]+1);p.dents.push({x:lx+R(-3,3),y:ly+R(-3,3),rx:R(3,6),ry:R(1.5,3.5),rot:R(-.5,.5)});addCell(lx,ly,false);kind='cam'}else if(insideScreen(lx,ly)){p.screenHits++;addCell(lx,ly,true);if(!p.screenOff){if(p.screenHits<=3||Math.random()<.58)addFault(lx,ly);if(p.screenHits>9||[...p.cells].filter(z=>z.startsWith('s')).length>=8)p.screenOff=true}else{if(Math.random()<.55)p.screenMarks.push({x:lx,y:ly,rx:R(7,18),ry:R(2,6),rot:R(-1,1),a:R(.12,.23)})}}else{p.frameHits++;addCell(lx,ly,false);let edge=Math.min(lx,p.w-lx,ly,p.h-ly);if(edge<28)p.cornerHits++;p.dents.push({x:lx,y:ly,rx:R(6,14),ry:R(2,5),rot:R(-.8,.8)});kind='frame'}hitSound(kind);kick(lx,ly);navigator.vibrate?.(7);damage();draw()}
stage.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
