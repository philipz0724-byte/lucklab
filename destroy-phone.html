<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Destroy a Phone</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900;letter-spacing:.02em}.badge{font-size:12px;opacity:.72}.stage{position:relative;flex:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 34%,#26384f 0,#101925 46%,#08101a 72%);box-shadow:inset 0 0 85px rgba(255,255,255,.025)}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;top:8%;left:0;right:0;text-align:center;pointer-events:none;transition:.2s}.hint.hide{opacity:0}.flipHint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;opacity:.58;pointer-events:none}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meter{height:12px;background:#182231;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff776f,#ffd5cf);transition:width .22s ease}.bottom{display:flex;gap:10px}button{flex:1;padding:14px;border:0;border-radius:16px;font-weight:800}</style></head><body><div class="wrap"><div class="top"><div class="title">DESTROY A PHONE</div><div class="badge" id="count">Destroyed: 0</div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="hint" id="hint"><b>MAKE IT UNUSABLE</b><br><small>Hit both sides of the phone</small></div><div class="flipHint">Swipe left or right to flip</div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div id="pct">0%</div></div><div class="bottom"><button id="sound">Sound: ON</button><button id="reset">NEW PHONE</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');
let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={},anim=false,dragX=null;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r)}
function reset(redraw=true){done=false;p.side='front';p.flip=0;p.flipTarget=0;p.frontFaults=[];p.frontMarks=[];p.backCracks=[];p.backChips=[];p.frontDents=[];p.backDents=[];p.cam=[0,0,0];p.frontCells=new Map();p.backCells=new Map();p.frameCells=new Map();p.screenHits=0;p.backHits=0;p.frameHits=0;p.totalHits=0;p.screenOff=false;p.fade=1;p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;fill.style.width='0%';pct.textContent='0%';hint.classList.remove('hide');if(redraw)draw()}
function layout(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=Math.min(H*.70,620),w=Math.min(W*.74,h*.5);p.w=w;p.h=h;p.x=(W-w)/2;p.y=(H-h)/2+14;p.r=Math.min(38,w*.11);if(!p.frontFaults)reset(false);draw()}addEventListener('resize',layout);
function screen(){let m=p.w*.058;return{x:m,y:m,w:p.w-2*m,h:p.h-2*m,r:p.r*.78}}function cams(){return[[p.w*.27,p.h*.13],[p.w*.42,p.h*.13],[p.w*.345,p.h*.24]]}
function matrix(){let shx=p.tx*.004,shy=p.ty*.003,sx=1-Math.abs(p.ty)*.0018,sy=1-Math.abs(p.tx)*.0013;return{a:sx,b:shy,c:shx,d:sy,e:p.x+p.w/2,f:p.y+p.h/2}}
function worldToLocal(x,y){let m=matrix(),X=x-m.e,Y=y-m.f,det=m.a*m.d-m.b*m.c;if(!det)return{x:-999,y:-999};return{x:(m.d*X-m.c*Y)/det+p.w/2,y:(-m.b*X+m.a*Y)/det+p.h/2}}
function applyPhoneTransform(){let m=matrix();ctx.translate(m.e,m.f);ctx.rotate(p.rot);ctx.transform(m.a,m.b,m.c,m.d,0,0);ctx.translate(-p.w/2,-p.h/2)}
function inside(lx,ly){return lx>=0&&lx<=p.w&&ly>=0&&ly<=p.h}function insideScreen(lx,ly){let s=screen();return lx>=s.x&&lx<=s.x+s.w&&ly>=s.y&&ly<=s.y+s.h}
function cellKey(lx,ly,cols=6,rows=10){let cc=Math.floor(C(lx/p.w*cols,0,cols-1)),rrr=Math.floor(C(ly/p.h*rows,0,rows-1));return rrr+'-'+cc}
function bumpCell(map,key){map.set(key,Math.min(3,(map.get(key)||0)+1))}function cellScore(map){let s=0;for(const v of map.values())s+=v===1?1:v===2?1.55:1.9;return s}
function wallpaper(s){let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'#123a83');g.addColorStop(.38,'#6549db');g.addColorStop(.72,'#da5aa3');g.addColorStop(1,'#f59b60');ctx.fillStyle=g;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();let sheen=ctx.createLinearGradient(s.x,s.y,s.x+s.w*.65,s.y+s.h);sheen.addColorStop(0,'rgba(255,255,255,.16)');sheen.addColorStop(.22,'rgba(255,255,255,.025)');sheen.addColorStop(.52,'rgba(255,255,255,0)');sheen.addColorStop(1,'rgba(255,255,255,.035)');ctx.fillStyle=sheen;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.97)';ctx.textAlign='center';ctx.font=`700 ${Math.max(18,s.w*.16)}px system-ui`;ctx.fillText('9:41',s.x+s.w/2,s.y+s.h*.25);ctx.font=`500 ${Math.max(9,s.w*.045)}px system-ui`;ctx.fillText('Saturday, August 8',s.x+s.w/2,s.y+s.h*.31)}
function addFrontFault(x,y){let s=screen(),t=Math.floor(R(0,5));if(t===0)p.frontFaults.push({t:'bruise',x,y,r:R(11,24),h:R(220,330),a:R(.16,.31)});else if(t===1)p.frontFaults.push({t:'dead',x,y,rx:R(6,15),ry:R(10,28),rot:R(-.5,.5),a:R(.32,.58)});else if(t===2)p.frontFaults.push({t:'line',x:C(x+R(-5,5),s.x+2,s.x+s.w-2),y1:C(y-R(15,42),s.y,s.y+s.h),y2:C(y+R(15,42),s.y,s.y+s.h),h:R(150,330),a:R(.22,.45)});else p.frontMarks.push({x,y,rx:R(5,14),ry:R(1.5,4.5),rot:R(-1,1),a:R(.07,.14)})}
function backInset(){const m=6;return{x:m,y:m,w:p.w-2*m,h:p.h-2*m,r:Math.max(4,p.r-m)}}
function addBackCrack(x,y){let segs=[],n=Math.floor(R(3,6)),b=backInset();for(let i=0;i<n;i++){let a=R(0,Math.PI*2),len=R(14,38),pts=[[C(x,b.x+1,b.x+b.w-1),C(y,b.y+1,b.y+b.h-1)]],cx=x,cy=y;for(let j=0;j<4;j++){a+=R(-.28,.28);cx=C(cx+Math.cos(a)*len/4*R(.7,1.3),b.x+1,b.x+b.w-1);cy=C(cy+Math.sin(a)*len/4*R(.7,1.3),b.y+1,b.y+b.h-1);pts.push([cx,cy])}segs.push(pts)}p.backCracks.push(segs)}
function drawFront(){let s=screen();ctx.save();rr(s.x,s.y,s.w,s.h,s.r);ctx.clip();if(!p.screenOff)wallpaper(s);else{ctx.fillStyle='#010205';ctx.fillRect(s.x,s.y,s.w,s.h);let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'rgba(255,255,255,.085)');g.addColorStop(.18,'rgba(255,255,255,.01)');g.addColorStop(.48,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.025)');ctx.fillStyle=g;ctx.fillRect(s.x,s.y,s.w,s.h)}if(!p.screenOff)for(const f of p.frontFaults){if(f.t==='bruise'){let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`hsla(${f.h},90%,62%,${f.a})`);g.addColorStop(.55,`hsla(${f.h+50},90%,55%,${f.a*.24})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}else if(f.t==='dead'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=`rgba(0,0,0,${f.a})`;ctx.beginPath();ctx.ellipse(0,0,f.rx,f.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}else if(f.t==='line'){ctx.strokeStyle=`hsla(${f.h},95%,65%,${f.a})`;ctx.lineWidth=.75;ctx.beginPath();ctx.moveTo(f.x,f.y1);ctx.lineTo(f.x,f.y2);ctx.stroke()}}for(const m of p.frontMarks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle=`rgba(255,255,255,${m.a})`;ctx.beginPath();ctx.ellipse(0,0,m.rx,m.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}
function drawCamera(q,i){let d=p.cam[i],outer=p.w*.088,lens=p.w*.057;ctx.save();ctx.shadowColor='rgba(0,0,0,.48)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.beginPath();ctx.arc(q[0],q[1],outer,0,Math.PI*2);let ring=ctx.createRadialGradient(q[0]-3,q[1]-4,2,q[0],q[1],outer);ring.addColorStop(0,'#4a535e');ring.addColorStop(.36,'#252b33');ring.addColorStop(.72,'#151920');ring.addColorStop(1,'#090c11');ctx.fillStyle=ring;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(q[0],q[1],lens,0,Math.PI*2);let lg=ctx.createRadialGradient(q[0]-3,q[1]-4,1,q[0],q[1],lens);lg.addColorStop(0,d>=5?'#202020':'#214b70');lg.addColorStop(.42,d>=4?'#101011':'#0b2235');lg.addColorStop(1,'#010305');ctx.fillStyle=lg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=.7;ctx.stroke();ctx.beginPath();ctx.arc(q[0]-lens*.23,q[1]-lens*.24,lens*.18,0,Math.PI*2);ctx.fillStyle=d>=4?'rgba(255,255,255,.02)':'rgba(176,226,255,.26)';ctx.fill();if(d>0){ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],lens*.96,0,Math.PI*2);ctx.clip();ctx.fillStyle=`rgba(205,215,220,${Math.min(.38,d*.06)})`;ctx.fillRect(q[0]-lens,q[1]-lens,lens*2,lens*2);if(d>=3){ctx.fillStyle='rgba(0,0,0,.50)';ctx.beginPath();ctx.moveTo(q[0]+lens*.15,q[1]-lens);ctx.lineTo(q[0]+lens,q[1]-lens*.25);ctx.lineTo(q[0]+lens*.62,q[1]+lens*.55);ctx.closePath();ctx.fill()}ctx.restore()}ctx.restore()}
function drawBack(){let base=ctx.createLinearGradient(0,0,p.w,p.h);base.addColorStop(0,'#e0e3e6');base.addColorStop(.30,'#c8cdd2');base.addColorStop(.66,'#a2aab2');base.addColorStop(1,'#7c848c');ctx.fillStyle=base;rr(0,0,p.w,p.h,p.r);ctx.fill();let gloss=ctx.createLinearGradient(0,0,p.w*.86,p.h);gloss.addColorStop(0,'rgba(255,255,255,.36)');gloss.addColorStop(.16,'rgba(255,255,255,.09)');gloss.addColorStop(.48,'rgba(255,255,255,0)');gloss.addColorStop(1,'rgba(0,0,0,.075)');ctx.fillStyle=gloss;rr(4,4,p.w-8,p.h-8,p.r-4);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=1;rr(5,5,p.w-10,p.h-10,p.r-5);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.09)';ctx.beginPath();ctx.arc(p.w*.5,p.h*.57,p.w*.112,0,Math.PI*2);ctx.fill();cams().forEach((q,i)=>drawCamera(q,i));const b=backInset();ctx.save();rr(b.x,b.y,b.w,b.h,b.r);ctx.clip();ctx.strokeStyle='rgba(237,246,250,.46)';ctx.lineWidth=.46;for(const group of p.backCracks)for(const pts of group){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}for(const m of p.backChips){ctx.save();ctx.translate(C(m.x,b.x,b.x+b.w),C(m.y,b.y,b.y+b.h));ctx.rotate(m.rot);ctx.fillStyle='rgba(68,73,80,.44)';ctx.beginPath();ctx.moveTo(-m.r*.7,m.r*.4);ctx.lineTo(0,-m.r);ctx.lineTo(m.r*.8,m.r*.55);ctx.closePath();ctx.fill();ctx.restore()}for(const d of p.backDents){ctx.save();ctx.translate(C(d.x,b.x,b.x+b.w),C(d.y,b.y,b.y+b.h));ctx.rotate(d.rot);let dg=ctx.createRadialGradient(0,0,0,0,0,Math.max(d.rx,d.ry));dg.addColorStop(0,'rgba(0,0,0,.20)');dg.addColorStop(.58,'rgba(0,0,0,.08)');dg.addColorStop(.86,'rgba(255,255,255,.05)');dg.addColorStop(1,'rgba(255,255,255,.10)');ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}
function drawPhone(){ctx.save();applyPhoneTransform();ctx.globalAlpha=p.fade;let visible=Math.max(.08,Math.abs(Math.cos(p.flip*Math.PI))),sx=Math.max(.08,visible);ctx.translate(p.w/2,0);ctx.scale(sx,1);ctx.translate(-p.w/2,0);let depth=8+Math.sin(p.flip*Math.PI)*13;ctx.shadowColor='rgba(0,0,0,.66)';ctx.shadowBlur=32;ctx.shadowOffsetY=20;ctx.fillStyle='#05080c';rr(depth,depth,p.w,p.h,p.r);ctx.fill();ctx.shadowBlur=0;let edge=ctx.createLinearGradient(0,0,p.w,0);edge.addColorStop(0,'#626a74');edge.addColorStop(.08,'#394049');edge.addColorStop(.26,'#20252b');edge.addColorStop(.50,'#101419');edge.addColorStop(.76,'#2c3239');edge.addColorStop(.93,'#4b535d');edge.addColorStop(1,'#707986');ctx.fillStyle=edge;rr(0,0,p.w,p.h,p.r);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.5;rr(1.5,1.5,p.w-3,p.h-3,p.r-2);ctx.stroke();ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=.8;rr(4,4,p.w-8,p.h-8,p.r-4);ctx.stroke();if(p.flip<.5){drawFront();for(const d of p.frontDents){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);let dg=ctx.createRadialGradient(0,0,0,0,0,Math.max(d.rx,d.ry));dg.addColorStop(0,'rgba(0,0,0,.40)');dg.addColorStop(.65,'rgba(0,0,0,.11)');dg.addColorStop(.88,'rgba(255,255,255,.04)');dg.addColorStop(1,'rgba(255,255,255,.08)');ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}}else drawBack();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawPhone()}
function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=800,d=.05,type='highpass'){if(!soundOn)return;let A=audioCtx(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type=type;f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function thump(freq=150,gain=.04,dur=.08){if(!soundOn)return;const A=audioCtx(),now=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.45),now+dur);g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(A.destination);o.start();o.stop(now+dur+.01)}function hitSound(kind){if(kind==='frame'){thump(R(105,150),.055,.09);noise(.04,900,.045)}else if(kind==='cam'){thump(R(170,230),.035,.06);noise(.045,1500,.035)}else if(kind==='back'){thump(R(125,175),.05,.08);noise(.035,650,.05,'bandpass')}else{thump(R(145,190),.042,.065);noise(.03,850,.04,'bandpass')}}
function visualDamage(){let fs=cellScore(p.frontCells),bs=cellScore(p.backCells),fr=cellScore(p.frameCells),cam=p.cam.reduce((a,b)=>a+Math.min(b,6),0);let frontVis=Math.min(28,fs*1.05+p.frontFaults.length*.75+p.frontMarks.length*.22+(p.screenOff?6:0));let backVis=Math.min(28,bs*1.05+p.backCracks.length*.72+p.backChips.length*.7+p.backDents.length*.42);let frameVis=Math.min(18,fr*1.25+p.frontDents.length*.35);let camVis=Math.min(16,cam*1.22);return C(frontVis+backVis+frameVis+camVis+Math.min(10,p.totalHits*.08),0,100)}
function damage(){let d=visualDamage();fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=99&&!done)finish()}
function kick(lx,ly){let nx=lx/p.w-.5,ny=ly/p.h-.5;p.vx+=nx*4;p.vy+=ny*4;p.vr+=nx*.005;startAnim()}function startAnim(){if(anim)return;anim=true;requestAnimationFrame(step)}function step(){p.tx+=p.vx;p.ty+=p.vy;p.rot+=p.vr;p.vx+=(-p.tx*.11-p.vx*.32);p.vy+=(-p.ty*.11-p.vy*.32);p.vr+=(-p.rot*.15-p.vr*.3);p.flip+=(p.flipTarget-p.flip)*.18;draw();if(Math.abs(p.tx)+Math.abs(p.ty)+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.rot)*100+Math.abs(p.flipTarget-p.flip)*60>0.12&&!done)requestAnimationFrame(step);else{p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;p.flip=p.flipTarget;anim=false;draw()}}
function finish(){done=true;total++;count.textContent='Destroyed: '+total;thump(80,.10,.18);noise(.10,420,.16,'bandpass');navigator.vibrate?.([18,24,38]);let st=performance.now();function fall(){let t=(performance.now()-st)/850;p.fade=Math.max(0,1-t*.8);p.y+=2+t*7;p.rot+=.01;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},450)}requestAnimationFrame(fall)}
function hit(wx,wy){if(done)return;let q=worldToLocal(wx,wy),lx=q.x,ly=q.y;if(!inside(lx,ly))return;hint.classList.add('hide');p.totalHits++;let kind=p.side==='front'?'screen':'back';if(p.side==='front'){if(insideScreen(lx,ly)){p.screenHits++;bumpCell(p.frontCells,cellKey(lx,ly));if(!p.screenOff){let score=cellScore(p.frontCells);if(p.frontFaults.length<14&&Math.random()<.36)addFrontFault(lx,ly);if(p.screenHits>=34||score>=28)p.screenOff=true}else if(p.frontMarks.length<18&&Math.random()<.28)p.frontMarks.push({x:lx,y:ly,rx:R(5,14),ry:R(1.5,4.5),rot:R(-1,1),a:R(.07,.15)})}else{p.frameHits++;bumpCell(p.frameCells,cellKey(lx,ly));if(p.frontDents.length<24)p.frontDents.push({x:lx,y:ly,rx:R(5,12),ry:R(2,5),rot:R(-.7,.7)});kind='frame'}}else{let k=-1,bd=p.w*.1;cams().forEach((qq,i)=>{let d=Math.hypot(lx-qq[0],ly-qq[1]);if(d<bd){bd=d;k=i}});if(k>=0){p.cam[k]=Math.min(6,p.cam[k]+1);bumpCell(p.backCells,cellKey(lx,ly));kind='cam'}else{p.backHits++;bumpCell(p.backCells,cellKey(lx,ly));if(p.backCracks.length<18&&Math.random()<.46)addBackCrack(lx,ly);if(p.backChips.length<14&&Math.random()<.16)p.backChips.push({x:lx,y:ly,r:R(3,8),rot:R(0,6)});if(p.backDents.length<20&&Math.random()<.30)p.backDents.push({x:lx,y:ly,rx:R(5,14),ry:R(2,6),rot:R(-.8,.8)});kind='back'}}hitSound(kind);kick(lx,ly);navigator.vibrate?.(7);damage();draw()}
function flipPhone(){p.side=p.side==='front'?'back':'front';p.flipTarget=p.side==='front'?0:1;startAnim()}
stage.addEventListener('pointerdown',e=>{dragX=e.clientX});stage.addEventListener('pointerup',e=>{let dx=e.clientX-dragX;if(Math.abs(dx)>45)flipPhone();else{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)}dragX=null});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
