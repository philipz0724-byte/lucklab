</style></head><body><div class="app" id="mw-basement"><header class="bar"><div class="brand">◈ MEMORY WORLD</div><div class="mode" id="mode">探索模式</div><div class="location" id="location">地下室 · B1</div></header><div class="body"><section class="main"><div class="game"><canvas id="world" width="704" height="448" aria-label="可探索的像素风地下记忆实验室"></canvas><div class="task" id="task">任务：认识洛，调查地下室里的设备</div><div class="prompt" id="prompt">点击地图移动 · 靠近设备按 A 互动</div><div class="modal" id="modal" hidden></div></div><div class="pad"><div class="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div><div class="help">像经典 RPG 一样走动<br/>也能直接点击地图自动寻路</div><div class="actions"><button class="round" id="b">B</button><button class="round a" id="a">A</button></div></div><div class="status"><span>设定：<strong>人类记忆保全计划 · 2046</strong></span><span id="project">尚未建立记忆项目</span></div></section><aside class="side" id="side"><div class="face"><div class="avatar"></div><div><b>洛 · 记忆向导</b><small>实验协议 / 演示对话</small></div><button id="expand" style="margin-left:auto;border:0;background:transparent;color:#abd0d3">↕</button></div><div class="msg" id="msg">欢迎来到人类记忆保全计划。这里不大，但也许能装下很多人的故事。<br/>你可以先来找我，或者自己看看这些装置。</div><div class="choices" id="choices"></div><form class="entry" id="form"><input id="chat" placeholder="和洛说说你的想法…" autocomplete="off"/><button type="submit">发送</button></form><div class="asideNote">向导目前使用预设规则，没有接入实时 AI；输入的故事只会保存在本设备。</div></aside></div></div><script>
(()=>{const root=document.getElementById('mw-basement');if(root.dataset.loaded)return;root.dataset.loaded='1';const $=id=>root.querySelector('#'+id),canvas=$('world'),c=canvas.getContext('2d');c.imageSmoothingEnabled=false;const W=22,H=16,S=32,base={x:11,y:9,dir:'up'};let p={...base},world='lab',path=[],walkTimer=0,dialog='',dialogChoices=[],visited=new Set(),project={story:'',theme:''};try{project={...project,...JSON.parse(localStorage.getItem('memory-world-basement-v1')||'{}')}}catch(e){}const save=()=>{try{localStorage.setItem('memory-world-basement-v1',JSON.stringify(project))}catch(e){}};const sources=[{id:'story',name:'记忆接收台',x:4,y:8,tx:4,ty:6},{id:'core',name:'记忆重建核心',x:10,y:8,tx:10,ty:6},{id:'sim',name:'环境模拟终端',x:17,y:8,tx:17,ty:6},{id:'guide',name:'洛',x:14,y:10},{id:'logs',name:'实验记录',x:5,y:10},{id:'exit',name:'楼梯',x:11,y:14}];const arr=()=>world==='lab'?sources:[{id:'back',name:'返回地下室',x:11,y:13},{id:'demo-npc',name:'模拟人物',x:15,y:8}];const walls=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(x===0||x===W-1||y<=2||y===15)walls.add(x+','+y)};const obstacles=[[2,5,6,7],[9,4,12,7],[16,5,19,7],[2,9,4,10],[18,10,19,11],[4,12,6,13],[1,12,2,13]];for(const [x1,y1,x2,y2] of obstacles)for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)walls.add(x+','+y);walls.delete('11,15');walls.delete('10,15');const blocked=(x,y)=>x<0||y<0||x>=W||y>=H||(world==='lab'&&walls.has(x+','+y))||arr().some(o=>o.x===x&&o.y===y&&o.id!=='exit'&&o.id!=='back'&&o.id!=='story'&&o.id!=='core'&&o.id!=='sim'&&o.id!=='logs');const active=()=>arr().filter(o=>Math.abs(p.x-o.x)+Math.abs(p.y-o.y)<=2).sort((a,b)=>Math.abs(p.x-a.x)+Math.abs(p.y-a.y)-Math.abs(p.x-b.x)-Math.abs(p.y-b.y))[0];const talk=(s,opts=[])=>{dialog=s;dialogChoices=opts;$('msg').textContent=s;const el=$('choices');el.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o[0];b.addEventListener('click',o[1]);el.appendChild(b)});$('side').classList.toggle('expanded',!!opts.length)};const report=()=>{$(
