const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={},anim=false,dragX=null;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));

function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=800,d=.05,type='highpass'){if(!soundOn)return;let A=audioCtx(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type=type;f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function thump(freq=150,gain=.04,dur=.08){if(!soundOn)return;const A=audioCtx(),now=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.45),now+dur);g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(A.destination);o.start();o.stop(now+dur+.01)}function hitSound(k){if(k==='frame'){thump(R(105,150),.055,.09);noise(.04,900,.045)}else if(k==='cam'){thump(R(170,230),.035,.06);noise(.045,1500,.035)}else if(k==='back'){thump(R(125,175),.05,.08);noise(.035,650,.05,'bandpass')}else{thump(R(145,190),.042,.065);noise(.03,850,.04,'bandpass')}}
function progress(){let fCov=coverage(p.frontCells),bCov=coverage(p.backCells),frCov=coverage(p.frameCells),fSev=C(score(p.frontCells)/50,0,1),bSev=C(score(p.backCells)/50,0,1),frSev=C(score(p.frameCells)/28,0,1);let front=35*C(fCov*.50+fSev*.24+Math.min(1,(p.frontFaults.length+p.frontCracks.length*.9+p.frontScuffs.length*.25)/13)*.18+(p.screenOff?.08:0),0,1);let holeArea=p.backHoles.reduce((a,h)=>a+Math.PI*h.r*h.r,0)/(p.w*p.h*.24);let back=35*C(bCov*.44+bSev*.22+Math.min(1,(p.backCracks.length+p.backDents.length*.4+p.backScuffs.length*.18)/14)*.14+C(holeArea,0,1)*.20,0,1);let frame=15*C(frCov*.62+frSev*.38,0,1),cameras=15*C(p.cam.reduce((a,b)=>a+b,0)/18,0,1);let d=front+back+frame+cameras,active=(p.frontCells.size>0)+(p.backCells.size>0)+(p.frameCells.size>0)+(p.cam.some(v=>v>0)?1:0);if(d>70&&active>=3)d+=Math.min(9,Math.max(0,p.totalHits-34)*.18);return C(d,0,100)}function damage(){let d=progress();fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=99&&!done)finish()}
function kick(x,y){p.vx+=(x/p.w-.5)*4;p.vy+=(y/p.h-.5)*4;p.vr+=(x/p.w-.5)*.005;startAnim()}function startAnim(){if(anim)return;anim=true;requestAnimationFrame(step)}function step(){p.tx+=p.vx;p.ty+=p.vy;p.rot+=p.vr;p.vx+=(-p.tx*.11-p.vx*.32);p.vy+=(-p.ty*.11-p.vy*.32);p.vr+=(-p.rot*.15-p.vr*.3);p.flip+=(p.flipTarget-p.flip)*.18;draw();if(Math.abs(p.tx)+Math.abs(p.ty)+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.rot)*100+Math.abs(p.flipTarget-p.flip)*60>.12&&!done)requestAnimationFrame(step);else{p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;p.flip=p.flipTarget;anim=false;draw()}}
function finish(){done=true;total++;count.textContent='Destroyed: '+total;thump(80,.1,.18);noise(.1,420,.16,'bandpass');navigator.vibrate?.([18,24,38]);let st=performance.now();function fall(){let t=(performance.now()-st)/850;p.fade=Math.max(0,1-t*.8);p.y+=2+t*7;p.rot+=.01;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},450)}requestAnimationFrame(fall)}
function hit(wx,wy){if(done)return;let q=worldToLocal(wx,wy),x=q.x,y=q.y;if(!inside(x,y))return;hint.classList.add('hide');p.totalHits++;let kind=p.side==='front'?'screen':'back';if(p.side==='front'){if(insideScreen(x,y)){p.screenHits++;bump(p.frontCells,cellKey(x,y));if(Math.random()<.28)addCrack(p.frontCracks,x,y,true);if(!p.screenOff){if(p.frontFaults.length<14&&Math.random()<.31)addFrontFault(x,y);if(p.screenHits>=42||score(p.frontCells)>=33)p.screenOff=true}else if(p.frontScuffs.length<18&&Math.random()<.22)p.frontScuffs.push({x,y,rx:R(5,13),ry:R(1.5,4),rot:R(-1,1),a:R(.05,.11)})}else{bump(p.frameCells,cellKey(x,y));if(p.frameDents.length<24)p.frameDents.push({x:C(x,2,p.w-2),y:C(y,2,p.h-2),rx:R(5,11),ry:R(2,4.5),rot:R(-.7,.7)});kind='frame'}}else{let k=-1,bd=p.w*.1;cams().forEach((q,i)=>{let d=Math.hypot(x-q[0],y-q[1]);if(d<bd){bd=d;k=i}});if(k>=0){p.cam[k]=Math.min(6,p.cam[k]+1);bump(p.backCells,cellKey(x,y));kind='cam'}else{p.backHits++;bump(p.backCells,cellKey(x,y));let near=addCrack(p.backCracks,x,y,false);if(Math.random()<.26)p.backScuffs.push({x,y,rx:R(5,14),ry:R(1.4,4),rot:R(-1,1),a:R(.05,.11)});if(Math.random()<.20)p.backDents.push({x,y,rx:R(5,12),ry:R(2,5),rot:R(-.8,.8)});let severity=near?near.level:1;if((severity>=3||score(p.backCells)>23)&&Math.random()<.34)addBackHole(x,y);kind='back'}}hitSound(kind);kick(x,y);navigator.vibrate?.(7);damage();draw()}
function flipPhone(){p.side=p.side==='front'?'back':'front';p.flipTarget=p.side==='front'?0:1;startAnim()}stage.addEventListener('pointerdown',e=>dragX=e.clientX);stage.addEventListener('pointerup',e=>{let dx=e.clientX-dragX;if(Math.abs(dx)>45)flipPhone();else{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)}dragX=null});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
