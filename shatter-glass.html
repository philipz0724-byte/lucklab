<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08111f" />
<title>Shatter Glass</title>
<style>
  :root{--bg:#08111f;--panel:#0d1a2d;--text:#f7fbff;--muted:#9bb0c8;--accent:#8de7ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 18%,#173457 0,#0a1729 42%,#050b14 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  body{touch-action:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-weight:900;letter-spacing:.04em;font-size:19px}.title span{color:var(--accent)}
  .badge{font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.04)}
  .stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(185,230,255,.12),rgba(255,255,255,.025));box-shadow:inset 0 0 60px rgba(160,220,255,.05),0 24px 70px rgba(0,0,0,.35)}
  .stage:before,.stage:after{content:"";position:absolute;pointer-events:none}
  .stage:before{inset:-25%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 44%,transparent 55%);transform:translateX(-18%)}
  .stage:after{inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.045),transparent 35%)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .hint{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.25s;z-index:3}
  .hint strong{display:block;font-size:28px;letter-spacing:.04em}.hint small{display:block;color:#bed4e8;margin-top:7px;font-size:14px}
  .hint.hide{opacity:0;transform:translateY(-45%) scale(.96)}
  .flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:4}
  .hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:0 2px}
  .meter{height:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#7ce2ff,#d7fbff);box-shadow:0 0 18px rgba(124,226,255,.7);transition:width .18s ease}
  .pct{font-weight:900;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
  .bottom{display:flex;gap:10px}
  button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;color:white;background:#132641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex:1}
  button.primary{background:#eefbff;color:#07111f}
  .destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.25s}
  .destroyed.show{opacity:1}
  .destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 60px rgba(0,0,0,.45)}
  .destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Tap the same spot to make the crack grow.</small></div>
    <div class="flash" id="flash"></div>
    <div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div>
  </div>
  <div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct');
const hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed');
const resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,hits=[],particles=[],damage=0,dead=false,soundOn=true,audio=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
addEventListener('resize',resize);
function rand(a,b){return a+Math.random()*(b-a)}
function nearest(x,y){let best=null,bd=85;for(const h of hits){let d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
function makeHit(x,y,existing){if(existing){existing.level=Math.min(5,existing.level+1);existing.seed=Math.random()*9999;return existing}
 const h={x,y,level:1,seed:Math.random()*9999,arms:Math.floor(rand(7,11))};hits.push(h);return h;}
function crackPoint(x,y,angle,len,wobble){const pts=[[x,y]];let cx=x,cy=y;const steps=Math.max(3,Math.floor(len/14));for(let i=1;i<=steps;i++){const t=i/steps;const a=angle+Math.sin(i*1.7+wobble)*.16+rand(-.035,.035);cx+=Math.cos(a)*(len/steps);cy+=Math.sin(a)*(len/steps);pts.push([cx,cy]);if(cx<0||cy<0||cx>W||cy>H)break}return pts}
function drawCrack(h){const radius=22+h.level*32;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 for(let i=0;i<h.arms+h.level*2;i++){const a=(Math.PI*2/(h.arms+h.level*2))*i+Math.sin(h.seed+i)*.27;const len=radius*rand(.7,1.25);const pts=crackPoint(h.x,h.y,a,len,h.seed+i);
   ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let j=1;j<pts.length;j++)ctx.lineTo(pts[j][0],pts[j][1]);ctx.strokeStyle='rgba(220,247,255,.92)';ctx.lineWidth=rand(.65,1.45);ctx.shadowColor='rgba(165,230,255,.8)';ctx.shadowBlur=2;ctx.stroke();
   if(h.level>=2&&i%2===0&&pts.length>2){const p=pts[Math.floor(rand(1,pts.length-1))];const ba=a+rand(-1.05,1.05);const branch=crackPoint(p[0],p[1],ba,len*rand(.22,.42),h.seed+i+5);ctx.beginPath();ctx.moveTo(branch[0][0],branch[0][1]);for(let j=1;j<branch.length;j++)ctx.lineTo(branch[j][0],branch[j][1]);ctx.lineWidth=.6;ctx.strokeStyle='rgba(230,250,255,.68)';ctx.stroke();}
 }
 ctx.beginPath();ctx.arc(h.x,h.y,4+h.level*1.2,0,Math.PI*2);ctx.fillStyle='rgba(238,253,255,.9)';ctx.shadowBlur=9;ctx.fill();ctx.restore();}
function spawnShards(x,y,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-4.6,4.6),vy:rand(-7,-1.5),g:rand(.16,.28),r:rand(4,14),rot:rand(0,6),vr:rand(-.18,.18),a:1})}
function drawParticles(){for(const p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.7,p.r*.5);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.7,p.r*.55);ctx.closePath();ctx.fillStyle=`rgba(195,235,250,${p.a*.35})`;ctx.strokeStyle=`rgba(240,253,255,${p.a*.8})`;ctx.lineWidth=.8;ctx.fill();ctx.stroke();ctx.restore();}}
function draw(){ctx.clearRect(0,0,W,H);for(const h of hits)drawCrack(h);drawParticles();}
function animate(){if(particles.length){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.012}particles=particles.filter(p=>p.a>0&&p.y<H+50);draw()}requestAnimationFrame(animate)}
function ping(intensity=1){if(!soundOn)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(1700+Math.random()*900,now);o.frequency.exponentialRampToValueAtTime(220,now+.065);f.type='highpass';f.frequency.value=650;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12*intensity,now+.003);g.gain.exponentialRampToValueAtTime(.0001,now+.08);o.connect(f).connect(g).connect(audio.destination);o.start(now);o.stop(now+.09);}
function boom(){if(!soundOn)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const n=audio.createBufferSource(),buf=audio.createBuffer(1,audio.sampleRate*.38,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);n.buffer=buf;const g=audio.createGain();g.gain.value=.28;n.connect(g).connect(audio.destination);n.start();}
function updateDamage(added){damage=Math.min(100,damage+added);fill.style.width=damage+'%';pct.textContent=Math.round(damage)+'%';if(damage>=100&&!dead)shatterAll();}
function shatterAll(){dead=true;boom();navigator.vibrate?.([20,30,45]);flash.animate([{opacity:.7},{opacity:0}],{duration:220});for(let i=0;i<5;i++)spawnShards(rand(0,W),rand(H*.15,H*.75),20);destroyed.classList.add('show');setTimeout(()=>stage.style.transform='translateY(2px)',30);setTimeout(()=>stage.style.transform='',130)}
function impact(x,y){if(dead)return;hint.classList.add('hide');const n=nearest(x,y);const h=makeHit(x,y,n);ping(.7+h.level*.08);navigator.vibrate?.(8+h.level*2);flash.animate([{opacity:.16},{opacity:0}],{duration:90});spawnShards(x,y,h.level>=4?8:3);updateDamage(n?4+h.level*1.2:7);draw();}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{hits=[];particles=[];damage=0;dead=false;fill.style.width='0%';pct.textContent='0%';destroyed.classList.remove('show');hint.classList.remove('hide');draw();ping(.45)};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};
resize();animate();
</script>
</body>
</html>
