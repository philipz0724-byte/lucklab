<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08111f"><title>Shatter Glass</title><style>:root{--t:#f7fbff;--m:#a7bbcf;--a:#8de7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353,#091727 46%,#050a12);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--a)}.badge{font-size:12px;color:var(--m);padding:7px 10px;border:1px solid #ffffff1f;border-radius:999px;background:#ffffff0a}.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid #ffffff26;background:linear-gradient(145deg,#b7e4ff24,#ffffff06);box-shadow:inset 0 0 70px #a0dcff0d,0 24px 70px #0006;transition:background .22s,opacity .22s}.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 35%,#ffffff1a 46%,transparent 57%);pointer-events:none}.stage.gone{background:#04091038}.stage.gone:before{opacity:0}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;inset:47% 0 auto;text-align:center;transform:translateY(-50%);pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:5}.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:#ffffff14;border:1px solid #ffffff1a}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);transition:width .18s}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px #ffffff14}button.primary{background:#eefbff;color:#07111f}</style></head><body><div class="wrap"><div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge" id="count">Shattered: 0</div></div><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Tap where you want the impact to happen.</small></div><div class="flash" id="flash"></div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div><div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">NEW GLASS</button></div></div><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage'),fill=$('fill'),pct=$('pct'),hint=$('hint'),flash=$('flash'),countEl=$('count');let W=0,H=0,dpr=1,impacts=[],bits=[],fall=[],dead=false,soundOn=true,audio=null,anim=false,shatterAt=0,total=0,renewTimer=0;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();damage()}addEventListener('resize',resize);
function allPaths(){let a=[];for(const h of impacts){for(const s of h.s)a.push(s.p);for(const r of h.r)a.push(r.p)}return a}function pd(px,py,ax,ay,bx,by){let vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-ax,py-ay);let c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-bx,py-by);let t=c1/c2;return Math.hypot(px-(ax+t*vx),py-(ay+t*vy))}function nearCrack(x,y,m=8){for(const p of allPaths())for(let i=1;i<p.length;i++)if(pd(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1])<m)return true;return false}function center(x,y,m=14){let z=null,d=m;for(const h of impacts){let q=Math.hypot(h.x-x,h.y-y);if(q<d){d=q;z=h}}return z}function snap(x,y,sx,sy,m=9){let z=null,d=m;for(const p of allPaths())for(const q of p){if(Math.hypot(q[0]-sx,q[1]-sy)<20)continue;let e=Math.hypot(q[0]-x,q[1]-y);if(e<d){d=e;z=q}}return z}
function path(x,y,a,l,rough=.13){let p=[[x,y]],cx=x,cy=y;const n=Math.max(4,Math.floor(l/R(11,18)));for(let i=0;i<n;i++){a+=R(-rough,rough);let s=l/n*R(.65,1.35),nx=cx+Math.cos(a)*s,ny=cy+Math.sin(a)*s,q=snap(nx,ny,x,y);if(q&&i>1){p.push([q[0],q[1]]);break}cx=nx;cy=ny;p.push([cx,cy]);if(cx<-20||cy<-20||cx>W+20||cy>H+20)break}return p}function ring(x,y,rad){let p=[],st=R(0,6.28),arc=R(.8,4.8),n=Math.floor(R(7,18));for(let i=0;i<=n;i++){let a=st+arc*i/n+R(-.06,.06),rr=rad*R(.84,1.16);p.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}return{p,w:R(.2,.45),a:R(.12,.29)}}
function make(x,y){let s=[],r=[],type=Math.floor(R(0,5)),sp=Math.floor(R(type===3?3:5,type===1?18:13)),rad=Math.min(W,H)*R(.09,type===3?.27:.21),rot=R(0,6.28);for(let i=0;i<sp;i++){let a=rot+6.28*i/sp+R(-.28,.28),len=rad*R(.5,Math.random()<.2?1.9:1.2),p=path(x,y,a,len,R(.07,.22));s.push({p,w:R(.2,.7),a:R(.32,.75)});if(p.length>3&&Math.random()<.55){let j=Math.floor(R(1,p.length-1)),q=p[j];s.push({p:path(q[0],q[1],a+R(-1.3,1.3),len*R(.12,.4),R(.1,.25)),w:R(.17,.45),a:R(.2,.46)})}}for(let i=0;i<(type===4?Math.floor(R(2,5)):Math.floor(R(0,3)));i++)r.push(ring(x,y,rad*R(.18,.75)));return{x,y,s,r,rad,lv:1}}
function deepen(h){h.lv=Math.min(7,h.lv+1);for(let i=0;i<Math.floor(R(2,5))+h.lv;i++){let a=R(0,6.28),sr=R(1,12),x=h.x+Math.cos(a)*sr,y=h.y+Math.sin(a)*sr;h.s.push({p:path(x,y,a+R(-.5,.5),h.rad*R(.2,.7),R(.1,.24)),w:R(.17,.48),a:R(.22,.55)})}if(Math.random()<.4)h.r.push(ring(h.x,h.y,h.rad*R(.3,.7)))}
function stroke(o){if(o.p.length<2)return;ctx.beginPath();ctx.moveTo(...o.p[0]);for(let i=1;i<o.p.length;i++)ctx.lineTo(...o.p[i]);ctx.strokeStyle=`rgba(229,245,250,${o.a})`;ctx.lineWidth=o.w;ctx.stroke()}function draw(){ctx.clearRect(0,0,W,H);if(!dead)for(const h of impacts){for(const r of h.r)stroke(r);for(const s of h.s)stroke(s);ctx.beginPath();ctx.arc(h.x,h.y,1.1+h.lv*.15,0,6.28);ctx.fillStyle='#f4fcffa0';ctx.fill()}for(const p of bits)piece(p,.5);for(const p of fall)piece(p,.45)}function piece(p,a){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(...p.pts[0]);for(let i=1;i<p.pts.length;i++)ctx.lineTo(...p.pts[i]);ctx.closePath();ctx.fillStyle=`rgba(190,225,240,${p.a*.1})`;ctx.strokeStyle=`rgba(240,252,255,${p.a*a})`;ctx.lineWidth=.5;ctx.fill();ctx.stroke();ctx.restore()}
function small(x,y,n=4){for(let i=0;i<n;i++){let z=R(2,7);bits.push({x:x+R(-5,5),y:y+R(-5,5),vx:R(-2.5,2.5),vy:R(-4,-.8),g:R(.16,.24),rot:R(0,6),vr:R(-.18,.18),a:1,pts:[[-z*.5,z*.4],[0,-z],[z*.6,z*.45]]})}}function pane(){fall=[];for(let i=0;i<68;i++){let x=R(-15,W+15),y=R(-15,H+15),size=Math.random()<.15?R(50,95):R(14,55),n=Math.floor(R(3,7)),pts=[];for(let j=0;j<n;j++){let a=6.28*j/n+R(-.35,.35),rr=size*R(.5,1.2);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}fall.push({x,y,pts,vx:(x-W/2)/(W/2)*R(.5,2.4)+R(-1.3,1.3),vy:R(-2,1),g:R(.1,.19),rot:R(-.05,.05),vr:R(-.045,.045),a:1,delay:R(0,.2)})}}
function tick(){anim=true;for(const p of bits){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.018}bits=bits.filter(p=>p.a>0&&p.y<H+40);if(dead){let e=(performance.now()-shatterAt)/1000;for(const p of fall){if(e<p.delay)continue;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.004}fall=fall.filter(p=>p.a>0&&p.y<H+220)}draw();if(bits.length||(dead&&fall.length))requestAnimationFrame(tick);else anim=false}function go(){if(!anim)requestAnimationFrame(tick)}
function score(){let cols=12,rows=18,cw=W/cols,ch=H/rows,set=new Set();for(const h of impacts){let e=h.rad*(.68+h.lv*.12);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(Math.hypot((c+.5)*cw-h.x,(r+.5)*ch-h.y)<=e)set.add(r*cols+c)}let depth=impacts.reduce((a,h)=>a+Math.min(2.1,h.lv*.32),0);return C(set.size/(cols*rows)*78+depth,0,100)}function damage(){if(dead)return;let d=Math.round(score());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96)shatter()}
function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(dur,hp,gain){if(!soundOn)return;let a=ac(),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),v=b.getChannelData(0);for(let i=0;i<n;i++)v[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=gain;s.connect(f).connect(g).connect(a.destination);s.start()}function hit(cracked){if(!soundOn)return;let a=ac(),now=a.currentTime;for(const f0 of(cracked?[1750,2650,3850]:[2150,3250,4750])){let o=a.createOscillator(),g=a.createGain();o.frequency.value=f0*R(.95,1.05);g.gain.setValueAtTime(.025,now);g.gain.exponentialRampToValueAtTime(.0001,now+(cracked?.045:.075));o.connect(g).connect(a.destination);o.start();o.stop(now+.09)}noise(cracked?.045:.065,1900,cracked?.05:.04)}function shSound(){noise(.65,700,.2);if(!soundOn)return;for(let i=0;i<7;i++)setTimeout(()=>hit(true),i*32)}
function fresh(manual=false){clearTimeout(renewTimer);impacts=[];bits=[];fall=[];dead=false;stage.classList.remove('gone');hint.classList.remove('hide');fill.style.width='0%';pct.textContent='0%';draw();if(manual)hit(false)}function shatter(){if(dead)return;dead=true;total++;countEl.textContent='Shattered: '+total;fill.style.width='100%';pct.textContent='100%';shSound();navigator.vibrate?.([15,20,34]);flash.animate([{opacity:.32},{opacity:0}],{duration:150});shatterAt=performance.now()+90;setTimeout(()=>{stage.classList.add('gone');pane();for(let i=0;i<7;i++)small(R(0,W),R(H*.15,H*.8),7);go()},90);renewTimer=setTimeout(()=>{stage.animate([{opacity:.72},{opacity:1}],{duration:260});fresh(false)},1450)}
function impact(x,y){if(dead)return;hint.classList.add('hide');let same=center(x,y,14),on=nearCrack(x,y,8);if(same){deepen(same);hit(true);small(x,y,3)}else{impacts.push(make(x,y));hit(on);if(on&&Math.random()<.3)small(x,y,2)}navigator.vibrate?.(on?8:6);flash.animate([{opacity:.05},{opacity:0}],{duration:55});draw();damage();if(bits.length)go()}stage.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});$('resetBtn').onclick=()=>fresh(true);$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent='Sound: '+(soundOn?'ON':'OFF')};resize();
</script></body></html>
