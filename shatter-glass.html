<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08111f" />
<title>Shatter Glass</title>
<style>
:root{--text:#f7fbff;--muted:#a7bbcf;--accent:#8de7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,#163353 0,#091727 46%,#050a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;font-size:19px;letter-spacing:.04em}.title span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04)}
.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(183,228,255,.14),rgba(255,255,255,.025));box-shadow:inset 0 0 70px rgba(160,220,255,.05),0 24px 70px rgba(0,0,0,.36);transition:background .2s}
.stage:before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.10) 46%,transparent 57%);pointer-events:none;transition:opacity .18s}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.03),transparent 34%);pointer-events:none;transition:opacity .18s}.stage.gone{background:rgba(4,9,16,.22)}.stage.gone:before,.stage.gone:after{opacity:0}
canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:.2s;z-index:3}.hint strong{font-size:28px;display:block}.hint small{display:block;color:#bdd0e2;margin-top:7px}.hint.hide{opacity:0;transform:translateY(-46%) scale(.97)}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:5}
.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 2px}.meter{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:0;background:linear-gradient(90deg,#78dffb,#dffaff);box-shadow:0 0 18px rgba(124,226,255,.65);transition:width .18s ease}.pct{font-weight:900;min-width:54px;text-align:right}.bottom{display:flex;gap:10px}button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;flex:1;color:#fff;background:#142641;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}button.primary{background:#eefbff;color:#07111f}
.destroyed{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;opacity:0;transition:.22s}.destroyed.show{opacity:1}.destroyed .card{text-align:center;padding:20px 26px;border-radius:22px;background:rgba(5,11,20,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 60px rgba(0,0,0,.45)}.destroyed b{display:block;font-size:30px;letter-spacing:.06em}.destroyed span{color:#b9cbe0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">SHATTER <span>GLASS</span></div><div class="badge">Tap anywhere</div></div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint"><strong>BREAK THE GLASS</strong><small>Tap where you want the impact to happen.</small></div>
    <div class="flash" id="flash"></div>
    <div class="destroyed" id="destroyed"><div class="card"><b>SHATTERED</b><span>100% destroyed</span></div></div>
  </div>
  <div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="bottom"><button id="soundBtn">Sound: ON</button><button class="primary" id="resetBtn">RESET GLASS</button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),flash=document.getElementById('flash'),destroyed=document.getElementById('destroyed'),resetBtn=document.getElementById('resetBtn'),soundBtn=document.getElementById('soundBtn');
let W=0,H=0,dpr=1,impacts=[],particles=[],paneShards=[],dead=false,soundOn=true,audio=null,shatterTime=0,animating=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();if(!dead)updateDamage();}
addEventListener('resize',resize);
function nearestImpactCenter(x,y,max=18){let best=null,bd=max;for(const h of impacts){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}return best}
function existingSegments(){const out=[];for(const h of impacts){for(const s of h.segments)out.push(s.pts);for(const r of h.rings)out.push(r.pts)}return out}
function pointSegDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-ax,py-ay);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-bx,py-by);const t=c1/c2,qx=ax+t*vx,qy=ay+t*vy;return Math.hypot(px-qx,py-qy)}
function nearExistingCrack(x,y,max=9){for(const pts of existingSegments())for(let i=1;i<pts.length;i++)if(pointSegDist(x,y,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])<max)return true;return false}
function maybeSnapPathPoint(x,y,excludeX,excludeY,max=11){let best=null,bd=max;for(const pts of existingSegments())for(let i=0;i<pts.length;i++){const p=pts[i];if(Math.hypot(p[0]-excludeX,p[1]-excludeY)<22)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=p}}return best}
function jaggedPath(x,y,angle,len,rough=.12){const pts=[[x,y]];let cx=x,cy=y,a=angle;const steps=Math.max(4,Math.floor(len/rand(11,18)));for(let i=0;i<steps;i++){a+=rand(-rough,rough);const s=len/steps*rand(.65,1.35);let nx=cx+Math.cos(a)*s,ny=cy+Math.sin(a)*s;const snap=maybeSnapPathPoint(nx,ny,x,y,10);if(snap&&i>1){nx=snap[0];ny=snap[1];pts.push([nx,ny]);break}cx=nx;cy=ny;pts.push([cx,cy]);if(cx<-25||cy<-25||cx>W+25||cy>H+25)break}return pts}
function makeRing(x,y,radius,alpha=.26){const start=rand(0,Math.PI*2),arc=rand(Math.PI*.25,Math.PI*1.6),pts=[],n=Math.floor(rand(7,18));for(let i=0;i<=n;i++){const a=start+arc*i/n+rand(-.055,.055),rr=radius*rand(.84,1.16);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}return {pts,w:rand(.22,.48),a:alpha}}
function makeImpact(x,y){const type=Math.floor(rand(0,5)),segments=[],rings=[];let spokes,radius,spread;
if(type===0){spokes=Math.floor(rand(4,8));radius=Math.min(W,H)*rand(.14,.24);spread=.28}
else if(type===1){spokes=Math.floor(rand(11,18));radius=Math.min(W,H)*rand(.08,.14);spread=.12}
else if(type===2){spokes=Math.floor(rand(7,11));radius=Math.min(W,H)*rand(.12,.19);spread=.20}
else if(type===3){spokes=Math.floor(rand(3,6));radius=Math.min(W,H)*rand(.18,.28);spread=.30}
else{spokes=Math.floor(rand(8,13));radius=Math.min(W,H)*rand(.10,.17);spread=.16}
const rotation=rand(0,Math.PI*2);
for(let i=0;i<spokes;i++){
  const angle= type===3 ? rotation+i*rand(.7,1.5)+rand(-.2,.2) : rotation+(Math.PI*2/spokes)*i+rand(-spread,spread);
  const len=radius*rand(Math.random()<.2?1.2:.5,Math.random()<.2?1.9:1.2);
  const pts=jaggedPath(x,y,angle,len,rand(.07,.22));segments.push({pts,w:rand(.22,.72),a:rand(.34,.78)});
  if(pts.length>3&&Math.random()<.62){const j=Math.floor(rand(1,pts.length-1)),p=pts[j],ba=angle+rand(-1.3,1.3);segments.push({pts:jaggedPath(p[0],p[1],ba,len*rand(.12,.42),rand(.11,.26)),w:rand(.18,.48),a:rand(.22,.48)})}
}
const ringCount=type===4?Math.floor(rand(2,5)):Math.floor(rand(0,3));for(let r=0;r<ringCount;r++)rings.push(makeRing(x,y,radius*rand(.16,.76),rand(.12,.30)));
return {x,y,type,level:1,radius,segments,rings};}
function deepenAtExactPoint(h){h.level=Math.min(7,h.level+1);for(let i=0;i<Math.floor(rand(2,5))+h.level;i++){const a=rand(0,Math.PI*2),sr=rand(1,13),sx=h.x+Math.cos(a)*sr,sy=h.y+Math.sin(a)*sr;h.segments.push({pts:jaggedPath(sx,sy,a+rand(-.5,.5),h.radius*rand(.22,.75),rand(.10,.24)),w:rand(.18,.5),a:rand(.24,.58)})}if(Math.random()<.45)h.rings.push(makeRing(h.x,h.y,h.radius*rand(.28,.72),rand(.12,.25)))}
function stroke(o){const p=o.pts;if(p.length<2)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=`rgba(229,245,250,${o.a})`;ctx.lineWidth=o.w;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.stroke()}
function drawImpact(h){ctx.save();for(const r of h.rings)stroke(r);for(const s of h.segments)stroke(s);ctx.beginPath();ctx.arc(h.x,h.y,1.2+h.level*.18,0,Math.PI*2);ctx.fillStyle='rgba(244,252,255,.65)';ctx.fill();ctx.restore()}
function spawnShards(x,y,n=5){for(let i=0;i<n;i++)particles.push({x:x+rand(-5,5),y:y+rand(-5,5),vx:rand(-2.6,2.6),vy:rand(-4.4,-.8),g:rand(.16,.24),r:rand(2.5,7.5),rot:rand(0,6),vr:rand(-.18,.18),a:1})}
function drawParticles(){for(const p of particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-p.r*.55,p.r*.4);ctx.lineTo(0,-p.r);ctx.lineTo(p.r*.6,p.r*.46);ctx.closePath();ctx.fillStyle=`rgba(185,225,240,${p.a*.14})`;ctx.strokeStyle=`rgba(240,252,255,${p.a*.56})`;ctx.lineWidth=.5;ctx.fill();ctx.stroke();ctx.restore()}}
function makePaneShards(){const shards=[];const seeds=[];for(let i=0;i<62;i++)seeds.push({x:rand(-20,W+20),y:rand(-20,H+20)});for(let i=0;i<seeds.length;i++){const s=seeds[i];const size=rand(18,72),n=Math.floor(rand(3,7)),pts=[];for(let j=0;j<n;j++){const a=Math.PI*2*j/n+rand(-.35,.35),rr=size*rand(.55,1.2);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}const edge=Math.min(s.x,W-s.x,s.y,H-s.y),early=edge<70?rand(0,.07):rand(.04,.22);shards.push({x:s.x,y:s.y,pts,vx:(s.x-W/2)/(W/2)*rand(.6,2.5)+rand(-1.4,1.4),vy:rand(-2.2,1.2),g:rand(.10,.19),rot:rand(-.05,.05),vr:rand(-.045,.045),a:1,delay:early,glint:rand(.05,.15)})}return shards}
function drawPaneShards(){const elapsed=(performance.now()-shatterTime)/1000;for(const s of paneShards){if(elapsed<s.delay)continue;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);for(let i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i][0],s.pts[i][1]);ctx.closePath();ctx.fillStyle=`rgba(190,225,240,${Math.max(0,s.a)*s.glint})`;ctx.strokeStyle=`rgba(236,249,255,${Math.max(0,s.a)*.48})`;ctx.lineWidth=.55;ctx.fill();ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);if(dead){drawPaneShards();drawParticles();return}for(const h of impacts)drawImpact(h);drawParticles()}
function tick(){animating=true;if(particles.length){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.a-=.018}particles=particles.filter(p=>p.a>0&&p.y<H+40)}if(dead&&paneShards.length){const elapsed=(performance.now()-shatterTime)/1000;for(const s of paneShards){if(elapsed<s.delay)continue;s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;s.rot+=s.vr;s.a-=.004}paneShards=paneShards.filter(s=>s.a>0&&s.y<H+260)}draw();if(particles.length||(dead&&paneShards.length))requestAnimationFrame(tick);else animating=false}
function ensureTick(){if(!animating)requestAnimationFrame(tick)}
function coverageDamage(){if(!W||!H)return 0;const cols=12,rows=18,cw=W/cols,ch=H/rows,covered=new Set();for(const h of impacts){const eff=h.radius*(.68+h.level*.12);const minC=Math.max(0,Math.floor((h.x-eff)/cw)),maxC=Math.min(cols-1,Math.floor((h.x+eff)/cw)),minR=Math.max(0,Math.floor((h.y-eff)/ch)),maxR=Math.min(rows-1,Math.floor((h.y+eff)/ch));for(let r=minR;r<=maxR;r++)for(let c=minC;c<=maxC;c++){const cx=(c+.5)*cw,cy=(r+.5)*ch;if(Math.hypot(cx-h.x,cy-h.y)<=eff)covered.add(r*cols+c)}}const area=covered.size/(cols*rows)*78;let depth=0;for(const h of impacts)depth+=Math.min(2.2,h.level*.34);return clamp(area+depth,0,100)}
function updateDamage(){const d=Math.round(coverageDamage());fill.style.width=d+'%';pct.textContent=d+'%';if(d>=96&&!dead)shatterAll()}
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function burstNoise(duration,highpass,gainVal){const ac=ensureAudio(),len=Math.floor(ac.sampleRate*duration),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const env=Math.pow(1-i/len,3.4);d[i]=(Math.random()*2-1)*env}const src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=highpass;g.gain.value=gainVal;src.connect(hp).connect(g).connect(ac.destination);src.start();}
function glassHit(kind='fresh'){if(!soundOn)return;const ac=ensureAudio(),now=ac.currentTime;const freqs=kind==='fresh'?[2100,3200,4700]:[1800,2700,3900];freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),bp=ac.createBiquadFilter();o.type='sine';o.frequency.value=f*rand(.94,1.06);bp.type='bandpass';bp.frequency.value=f;bp.Q.value=7;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime((kind==='fresh'?.032:.024)/(i+1),now+.001);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==='fresh'?.075:.045));o.connect(bp).connect(g).connect(ac.destination);o.start(now);o.stop(now+.09)});burstNoise(kind==='fresh'?.07:.045,1900,kind==='fresh'?.045:.055)}
function glassShatter(){if(!soundOn)return;burstNoise(.7,800,.22);const ac=ensureAudio();for(let i=0;i<8;i++)setTimeout(()=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=rand(1700,5200);g.gain.setValueAtTime(.028,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.09);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.1)},i*35)}
function shatterAll(){dead=true;fill.style.width='100%';pct.textContent='100%';glassShatter();navigator.vibrate?.([16,20,36]);flash.animate([{opacity:.34},{opacity:0}],{duration:160});shatterTime=performance.now()+100;setTimeout(()=>{stage.classList.add('gone');paneShards=makePaneShards();for(let i=0;i<8;i++)spawnShards(rand(0,W),rand(H*.12,H*.82),8);ensureTick();setTimeout(()=>destroyed.classList.add('show'),520)},100)}
function impact(x,y){if(dead)return;hint.classList.add('hide');const same=nearestImpactCenter(x,y,18);const onCrack=nearExistingCrack(x,y,8);if(same){deepenAtExactPoint(same);glassHit('cracked');spawnShards(x,y,3)}else{const h=makeImpact(x,y);impacts.push(h);glassHit(onCrack?'cracked':'fresh');if(onCrack&&Math.random()<.35)spawnShards(x,y,2)}navigator.vibrate?.(onCrack?8:6);flash.animate([{opacity:.055},{opacity:0}],{duration:55});draw();updateDamage();if(particles.length)ensureTick()}
stage.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impact(e.clientX-r.left,e.clientY-r.top)});
resetBtn.onclick=()=>{impacts=[];particles=[];paneShards=[];dead=false;stage.classList.remove('gone');destroyed.classList.remove('show');hint.classList.remove('hide');draw();updateDamage();glassHit('fresh')};
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'ON':'OFF')};
resize();
</script>
</body>
</html>
