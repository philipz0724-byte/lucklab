<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Destroy a Phone</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900}.badge{font-size:12px;opacity:.72}.stage{position:relative;flex:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 36%,#213043,#0a111b 66%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;top:8%;left:0;right:0;text-align:center;pointer-events:none;transition:.2s}.hint.hide{opacity:0}.flipHint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;opacity:.58;pointer-events:none}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meter{height:12px;background:#182231;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff776f,#ffd5cf);transition:width .15s}.bottom{display:flex;gap:10px}button{flex:1;padding:14px;border:0;border-radius:16px;font-weight:800}</style></head><body><div class="wrap"><div class="top"><div class="title">DESTROY A PHONE</div><div class="badge" id="count">Destroyed: 0</div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="hint" id="hint"><b>MAKE IT UNUSABLE</b><br><small>Hit both sides of the phone</small></div><div class="flipHint">Swipe left or right to flip</div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div id="pct">0%</div></div><div class="bottom"><button id="sound">Sound: ON</button><button id="reset">NEW PHONE</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={},anim=false,dragX=null;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r)}
function reset(redraw=true){done=false;p.side='front';p.flip=0;p.flipTarget=0;p.frontFaults=[];p.frontMarks=[];p.backCracks=[];p.backChips=[];p.frontDents=[];p.backDents=[];p.cam=[0,0,0];p.frontCells=new Set();p.backCells=new Set();p.frameCells=new Set();p.screenHits=0;p.backHits=0;p.frameHits=0;p.totalHits=0;p.screenOff=false;p.fade=1;p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;fill.style.width='0%';pct.textContent='0%';hint.classList.remove('hide');if(redraw)draw()}
function layout(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=Math.min(H*.70,620),w=Math.min(W*.74,h*.5);p.w=w;p.h=h;p.x=(W-w)/2;p.y=(H-h)/2+14;p.r=Math.min(38,w*.11);if(!p.frontFaults)reset(false);draw()}addEventListener('resize',layout);
function screen(){let m=p.w*.06;return{x:m,y:m,w:p.w-2*m,h:p.h-2*m,r:p.r*.78}}function cams(){return[[p.w*.27,p.h*.13],[p.w*.42,p.h*.13],[p.w*.345,p.h*.24]]}
function matrix(){let shx=p.tx*.004,shy=p.ty*.003,sx=1-Math.abs(p.ty)*.0018,sy=1-Math.abs(p.tx)*.0013;let a=sx,b=shy,c=shx,d=sy,e=p.x+p.w/2,f=p.y+p.h/2;return{a,b,c,d,e,f}}
function worldToLocal(x,y){let m=matrix(),X=x-m.e,Y=y-m.f,det=m.a*m.d-m.b*m.c;if(!det)return{x:-999,y:-999};let lx=(m.d*X-m.c*Y)/det,ly=(-m.b*X+m.a*Y)/det;return{x:lx+p.w/2,y:ly+p.h/2}}
function applyPhoneTransform(){let m=matrix();ctx.translate(m.e,m.f);ctx.rotate(p.rot);ctx.transform(m.a,m.b,m.c,m.d,0,0);ctx.translate(-p.w/2,-p.h/2)}
function inside(lx,ly){return lx>=0&&lx<=p.w&&ly>=0&&ly<=p.h}function insideScreen(lx,ly){let s=screen();return lx>=s.x&&lx<=s.x+s.w&&ly>=s.y&&ly<=s.y+s.h}
function cellKey(lx,ly,cols=5,rows=9){let cc=Math.floor(C(lx/p.w*cols,0,cols-1)),rrr=Math.floor(C(ly/p.h*rows,0,rows-1));return rrr+'-'+cc}
function wallpaper(s){let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'#123a83');g.addColorStop(.38,'#6448d8');g.addColorStop(.72,'#d856a2');g.addColorStop(1,'#ff9f5b');ctx.fillStyle=g;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.96)';ctx.textAlign='center';ctx.font=`700 ${Math.max(18,s.w*.16)}px system-ui`;ctx.fillText('9:41',s.x+s.w/2,s.y+s.h*.25);ctx.font=`500 ${Math.max(9,s.w*.045)}px system-ui`;ctx.fillText('Saturday, August 8',s.x+s.w/2,s.y+s.h*.31)}
function addFrontFault(x,y){let s=screen(),t=Math.floor(R(0,3));if(t===0)p.frontFaults.push({t:'bruise',x,y,r:R(14,28),h:R(220,330),a:R(.22,.42)});else if(t===1)p.frontFaults.push({t:'dead',x,y,rx:R(8,20),ry:R(14,38),rot:R(-.5,.5),a:R(.45,.75)});else p.frontFaults.push({t:'line',x:C(x+R(-5,5),s.x+2,s.x+s.w-2),y1:C(y-R(20,55),s.y,s.y+s.h),y2:C(y+R(20,55),s.y,s.y+s.h),h:R(150,330),a:R(.3,.62)})}
function addBackCrack(x,y){let segs=[],n=Math.floor(R(4,8));for(let i=0;i<n;i++){let a=R(0,Math.PI*2),len=R(18,48),pts=[[x,y]],cx=x,cy=y;for(let j=0;j<4;j++){a+=R(-.25,.25);cx+=Math.cos(a)*len/4*R(.7,1.3);cy+=Math.sin(a)*len/4*R(.7,1.3);pts.push([cx,cy])}segs.push(pts)}p.backCracks.push(segs)}
function drawFront(){let s=screen();ctx.save();rr(s.x,s.y,s.w,s.h,s.r);ctx.clip();if(!p.screenOff)wallpaper(s);else{ctx.fillStyle='#020305';ctx.fillRect(s.x,s.y,s.w,s.h);let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.3,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.018)');ctx.fillStyle=g;ctx.fillRect(s.x,s.y,s.w,s.h)}if(!p.screenOff)for(const f of p.frontFaults){if(f.t==='bruise'){let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`hsla(${f.h},90%,62%,${f.a})`);g.addColorStop(.55,`hsla(${f.h+50},90%,55%,${f.a*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}else if(f.t==='dead'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=`rgba(0,0,0,${f.a})`;ctx.beginPath();ctx.ellipse(0,0,f.rx,f.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}else{ctx.strokeStyle=`hsla(${f.h},95%,65%,${f.a})`;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(f.x,f.y1);ctx.lineTo(f.x,f.y2);ctx.stroke()}}for(const m of p.frontMarks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle=`rgba(255,255,255,${m.a})`;ctx.beginPath();ctx.ellipse(0,0,m.rx,m.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}
function drawCamera(q,i){let d=p.cam[i];ctx.beginPath();ctx.arc(q[0],q[1],p.w*.085,0,Math.PI*2);ctx.fillStyle='#11161c';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.arc(q[0],q[1],p.w*.056,0,Math.PI*2);ctx.fillStyle=d>=5?'#060708':'#09111a';ctx.fill();if(d>0){ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],p.w*.054,0,Math.PI*2);ctx.clip();let g=ctx.createRadialGradient(q[0]-3,q[1]-3,0,q[0],q[1],p.w*.07);g.addColorStop(0,`rgba(215,228,238,${Math.min(.55,d*.09)})`);g.addColorStop(1,'rgba(70,80,90,.08)');ctx.fillStyle=g;ctx.fillRect(q[0]-20,q[1]-20,40,40);if(d>=3){ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.moveTo(q[0]+2,q[1]-12);ctx.lineTo(q[0]+11,q[1]-4);ctx.lineTo(q[0]+7,q[1]+6);ctx.closePath();ctx.fill()}ctx.restore()}}
function drawBack(){let g=ctx.createLinearGradient(0,0,p.w,p.h);g.addColorStop(0,'#cfd4da');g.addColorStop(.45,'#aeb5bd');g.addColorStop(1,'#858d96');ctx.fillStyle=g;rr(0,0,p.w,p.h,p.r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.13)';rr(7,7,p.w-14,p.h-14,p.r-7);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.arc(p.w*.5,p.h*.57,p.w*.12,0,Math.PI*2);ctx.fill();cams().forEach((q,i)=>drawCamera(q,i));ctx.strokeStyle='rgba(230,240,245,.58)';ctx.lineWidth=.55;for(const group of p.backCracks)for(const pts of group){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}for(const m of p.backChips){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle='rgba(70,75,82,.55)';ctx.beginPath();ctx.moveTo(-m.r*.7,m.r*.4);ctx.lineTo(0,-m.r);ctx.lineTo(m.r*.8,m.r*.55);ctx.closePath();ctx.fill();ctx.restore()}for(const d of p.backDents){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drawPhone(){ctx.save();applyPhoneTransform();ctx.globalAlpha=p.fade;let visible=Math.max(.08,Math.abs(Math.cos(p.flip*Math.PI)));let scaleX=Math.max(.08,visible);ctx.translate(p.w/2,0);ctx.scale(scaleX,1);ctx.translate(-p.w/2,0);let depth=8+Math.sin(p.flip*Math.PI)*10;ctx.fillStyle='#0a0d12';rr(depth,depth,p.w,p.h,p.r);ctx.fill();if(p.flip<.5){let g=ctx.createLinearGradient(0,0,p.w,p.h);g.addColorStop(0,'#333941');g.addColorStop(.5,'#14171c');g.addColorStop(1,'#292e35');ctx.fillStyle=g;rr(0,0,p.w,p.h,p.r);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;rr(2,2,p.w-4,p.h-4,p.r-2);ctx.stroke();drawFront();for(const d of p.frontDents){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}}else drawBack();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawPhone()}
function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=800,d=.05){if(!soundOn)return;let A=audioCtx(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type='highpass';f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function hitSound(kind){if(kind==='frame')noise(.065,500,.07);else if(kind==='cam')noise(.06,1300,.05);else if(kind==='back')noise(.05,1050,.06);else noise(.045,900,.055)}
function damage(){let d=p.frontCells.size*2.15+p.backCells.size*2.25+p.frameCells.size*2.1+p.cam.reduce((a,b)=>a+Math.min(b,5),0)*1.45+Math.min(14,p.totalHits*.22);d=C(d,0,100);fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=99&&!done)finish()}
function kick(lx,ly){let nx=lx/p.w-.5,ny=ly/p.h-.5;p.vx+=nx*4;p.vy+=ny*4;p.vr+=nx*.005;startAnim()}function startAnim(){if(anim)return;anim=true;requestAnimationFrame(step)}function step(){p.tx+=p.vx;p.ty+=p.vy;p.rot+=p.vr;p.vx+=(-p.tx*.11-p.vx*.32);p.vy+=(-p.ty*.11-p.vy*.32);p.vr+=(-p.rot*.15-p.vr*.3);p.flip+=(p.flipTarget-p.flip)*.18;draw();if(Math.abs(p.tx)+Math.abs(p.ty)+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.rot)*100+Math.abs(p.flipTarget-p.flip)*60>0.12&&!done)requestAnimationFrame(step);else{p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;p.flip=p.flipTarget;anim=false;draw()}}
function finish(){done=true;total++;count.textContent='Destroyed: '+total;noise(.18,350,.3);navigator.vibrate?.([18,24,38]);let st=performance.now();function fall(){let t=(performance.now()-st)/850;p.fade=Math.max(0,1-t*.8);p.y+=2+t*7;p.rot+=.01;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},450)}requestAnimationFrame(fall)}
function hit(wx,wy){if(done)return;let q=worldToLocal(wx,wy),lx=q.x,ly=q.y;if(!inside(lx,ly))return;hint.classList.add('hide');p.totalHits++;let kind=p.side==='front'?'screen':'back';if(p.side==='front'){if(insideScreen(lx,ly)){p.screenHits++;p.frontCells.add(cellKey(lx,ly));if(!p.screenOff){if(Math.random()<.48)addFrontFault(lx,ly);if(p.screenHits>=22||p.frontCells.size>=15)p.screenOff=true}else if(Math.random()<.45)p.frontMarks.push({x:lx,y:ly,rx:R(7,18),ry:R(2,6),rot:R(-1,1),a:R(.12,.22)})}else{p.frameHits++;p.frameCells.add(cellKey(lx,ly));p.frontDents.push({x:lx,y:ly,rx:R(6,13),ry:R(2,5),rot:R(-.7,.7)});kind='frame'}}else{let k=-1,bd=p.w*.1;cams().forEach((qq,i)=>{let d=Math.hypot(lx-qq[0],ly-qq[1]);if(d<bd){bd=d;k=i}});if(k>=0){p.cam[k]=Math.min(6,p.cam[k]+1);p.backCells.add(cellKey(lx,ly));kind='cam'}else{p.backHits++;p.backCells.add(cellKey(lx,ly));if(Math.random()<.7)addBackCrack(lx,ly);if(Math.random()<.28)p.backChips.push({x:lx,y:ly,r:R(4,9),rot:R(0,6)});if(Math.random()<.4)p.backDents.push({x:lx,y:ly,rx:R(6,16),ry:R(2,6),rot:R(-.8,.8)});kind='back'}}hitSound(kind);kick(lx,ly);navigator.vibrate?.(7);damage();draw()}
function flipPhone(){p.side=p.side==='front'?'back':'front';p.flipTarget=p.side==='front'?0:1;startAnim()}
stage.addEventListener('pointerdown',e=>{dragX=e.clientX});stage.addEventListener('pointerup',e=>{let dx=e.clientX-dragX;if(Math.abs(dx)>45)flipPhone();else{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)}dragX=null});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
