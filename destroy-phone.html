<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Phone Stress Toy</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900}.badge{font-size:12px;opacity:.7}.stage{position:relative;flex:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1a2636,#090f18 65%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;top:9%;left:0;right:0;text-align:center;pointer-events:none;transition:.2s}.hint.hide{opacity:0}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meter{height:12px;background:#182231;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff776f,#ffd5cf)}button{flex:1;padding:14px;border:0;border-radius:16px;font-weight:800}.bottom{display:flex;gap:10px}</style></head><body><div class="wrap"><div class="top"><div class="title">PHONE STRESS TEST</div><div class="badge" id="count">Completed: 0</div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="hint" id="hint"><b>MAKE IT UNUSABLE</b><br><small>Tap screen, camera, or frame</small></div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div id="pct">0%</div></div><div class="bottom"><button id="sound">Sound: ON</button><button id="reset">NEW PHONE</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={};const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function layout(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);const h=Math.min(H*.72,630),w=Math.min(W*.76,h*.49);p.x=(W-w)/2;p.y=(H-h)/2+12;p.w=w;p.h=h;p.r=Math.min(40,w*.11);if(!p.faults)reset(false);draw()}addEventListener('resize',layout);function sr(){const m=p.w*.055;return{x:p.x+m,y:p.y+m,w:p.w-2*m,h:p.h-2*m,r:p.r*.8}}function insidePhone(a,b){return a>=p.x&&a<=p.x+p.w&&b>=p.y&&b<=p.y+p.h}function insideScreen(a,b){const s=sr();return a>=s.x&&a<=s.x+s.w&&b>=s.y&&b<=s.y+s.h}function cams(){const s=sr(),cy=s.y+s.h*.07;return[[s.x+s.w*.39,cy],[s.x+s.w*.5,cy],[s.x+s.w*.61,cy]]}function camAt(a,b){let k=-1,d=20;cams().forEach((q,i)=>{let n=Math.hypot(a-q[0],b-q[1]);if(n<d){d=n;k=i}});return k}function reset(redraw=true){done=false;p.faults=[];p.spots=[];p.lines=[];p.marks=[];p.dents=[];p.cams=[0,0,0];p.screenHits=0;p.frameHits=0;p.fade=1;fill.style.width='0%';pct.textContent='0%';hint.classList.remove('hide');if(redraw)draw()}function clipScreen(){const s=sr();rr(s.x,s.y,s.w,s.h,s.r);x.clip()}function wallpaper(s){let g=x.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'#123a83');g.addColorStop(.38,'#6448d8');g.addColorStop(.72,'#d856a2');g.addColorStop(1,'#ff9f5b');x.fillStyle=g;rr(s.x,s.y,s.w,s.h,s.r);x.fill();x.fillStyle='rgba(255,255,255,.95)';x.textAlign='center';x.font=`700 ${Math.max(18,s.w*.16)}px system-ui`;x.fillText('9:41',s.x+s.w/2,s.y+s.h*.25);x.font=`500 ${Math.max(9,s.w*.045)}px system-ui`;x.fillText('Saturday, August 8',s.x+s.w/2,s.y+s.h*.31)}function fault(a,b){const s=sr();a=C(a,s.x+4,s.x+s.w-4);b=C(b,s.y+4,s.y+s.h-4);const t=Math.floor(R(0,4));if(t===0)p.faults.push({x:a,y:b,r:R(18,40),h:R(200,330),a:R(.25,.5)});else if(t===1)p.spots.push({x:a,y:b,w:R(15,42),h:R(20,85),a:R(.35,.75),rot:R(-.5,.5)});else if(t===2)for(let i=0;i<Math.floor(R(2,5));i++)p.lines.push({x:C(a+R(-20,20),s.x+2,s.x+s.w-2),y1:C(b-R(30,80),s.y,s.y+s.h),y2:C(b+R(30,80),s.y,s.y+s.h),h:R(150,340),a:R(.35,.8)});else p.marks.push({x:a,y:b,rx:R(10,28),ry:R(4,12),rot:R(-.8,.8),a:R(.14,.3)})}function damage(){const cam=p.cams.reduce((a,b)=>a+b,0),screen=Math.min(60,p.faults.length*3+p.spots.length*4+p.lines.length*1.2+p.marks.length*1.5),frame=Math.min(22,p.frameHits*1.8),camera=Math.min(18,cam*2.8),d=C(screen+frame+camera,0,100);fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=98&&!done)finish()}function draw(){x.clearRect(0,0,W,H);const s=sr();x.save();x.globalAlpha=p.fade;x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=28;x.shadowOffsetY=18;rr(p.x,p.y,p.w,p.h,p.r);x.fillStyle='#16191e';x.fill();x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;rr(p.x+2,p.y+2,p.w-4,p.h-4,p.r-2);x.stroke();x.save();clipScreen();wallpaper(s);for(const o of p.faults){let g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,`hsla(${o.h},95%,68%,${o.a})`);g.addColorStop(.55,`hsla(${o.h+50},95%,55%,${o.a*.4})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}for(const q of p.spots){x.save();x.translate(q.x,q.y);x.rotate(q.rot);x.fillStyle=`rgba(0,0,0,${q.a})`;x.beginPath();x.ellipse(0,0,q.w/2,q.h/2,0,0,Math.PI*2);x.fill();x.restore()}for(const l of p.lines){x.strokeStyle=`hsla(${l.h},95%,65%,${l.a})`;x.lineWidth=R(.6,1.6);x.beginPath();x.moveTo(l.x,l.y1);x.lineTo(l.x,l.y2);x.stroke()}for(const m of p.marks){x.save();x.translate(m.x,m.y);x.rotate(m.rot);x.fillStyle=`rgba(255,255,255,${m.a})`;x.beginPath();x.ellipse(0,0,m.rx,m.ry,0,0,Math.PI*2);x.fill();x.restore()}x.restore();x.fillStyle='rgba(0,0,0,.9)';rr(s.x+s.w*.31,s.y+s.h*.028,s.w*.38,s.h*.075,s.h*.035);x.fill();cams().forEach((q,i)=>{x.beginPath();x.arc(q[0],q[1],6.2,0,Math.PI*2);x.fillStyle=p.cams[i]>2?'#000':'#111';x.fill();x.strokeStyle=p.cams[i]?'rgba(255,80,70,.8)':'rgba(255,255,255,.08)';x.stroke();if(p.cams[i]){x.beginPath();x.moveTo(q[0]-7,q[1]-5);x.lineTo(q[0]+7,q[1]+6);x.strokeStyle='rgba(235,245,255,.7)';x.stroke()}});for(const d of p.dents){x.save();x.translate(d.x,d.y);x.rotate(d.rot);x.fillStyle='rgba(0,0,0,.42)';x.beginPath();x.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2);x.fill();x.restore()}x.restore()}function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=900,d=.05){if(!soundOn)return;let A=ac(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type='highpass';f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function tap(){noise(.045,750,.05)}function finish(){done=true;total++;count.textContent='Completed: '+total;noise(.17,400,.25);navigator.vibrate?.([16,22,32]);let st=performance.now();function fall(){let t=(performance.now()-st)/800;p.fade=Math.max(0,1-t*.75);p.y+=3+t*8;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},420)}requestAnimationFrame(fall)}function hit(a,b){if(done||!insidePhone(a,b))return;hint.classList.add('hide');let k=camAt(a,b);if(k>=0){p.cams[k]++;p.dents.push({x:a,y:b,rx:R(4,8),ry:R(2,4),rot:R(-.5,.5)})}else if(insideScreen(a,b)){p.screenHits++;fault(a,b);if(p.screenHits>7&&Math.random()<.22)fault(a+R(-15,15),b+R(-18,18))}else{p.frameHits++;p.dents.push({x:a,y:b,rx:R(6,13),ry:R(2,5),rot:R(-.7,.7)})}tap();navigator.vibrate?.(6);damage();draw()}stage.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
