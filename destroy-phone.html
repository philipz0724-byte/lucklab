<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Destroy a Phone</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900;letter-spacing:.02em}.badge{font-size:12px;opacity:.72}.stage{position:relative;flex:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 34%,#2b3e56 0,#111a27 48%,#08101a 74%);box-shadow:inset 0 0 90px rgba(255,255,255,.025)}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;top:8%;left:0;right:0;text-align:center;pointer-events:none;transition:.2s}.hint.hide{opacity:0}.flipHint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;opacity:.58;pointer-events:none}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meter{height:12px;background:#182231;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff776f,#ffd5cf);transition:width .2s ease}.bottom{display:flex;gap:10px}button{flex:1;padding:14px;border:0;border-radius:16px;font-weight:800}</style></head><body><div class="wrap"><div class="top"><div class="title">DESTROY A PHONE</div><div class="badge" id="count">Destroyed: 0</div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="hint" id="hint"><b>MAKE IT UNUSABLE</b><br><small>Hit both sides of the phone</small></div><div class="flipHint">Swipe left or right to flip</div></div><div class="hud"><div class="meter"><div class="fill" id="fill"></div></div><div id="pct">0%</div></div><div class="bottom"><button id="sound">Sound: ON</button><button id="reset">NEW PHONE</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),hint=document.getElementById('hint'),count=document.getElementById('count');let W,H,dpr=1,audio,soundOn=true,done=false,total=0,p={},anim=false,dragX=null;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r)}
function reset(redraw=true){done=false;p.side='front';p.flip=0;p.flipTarget=0;p.frontFaults=[];p.frontMarks=[];p.backCracks=[];p.backScuffs=[];p.frontDents=[];p.backDents=[];p.cam=[0,0,0];p.frontCells=new Map();p.backCells=new Map();p.frameCells=new Map();p.totalHits=0;p.screenHits=0;p.backHits=0;p.screenOff=false;p.fade=1;p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;fill.style.width='0%';pct.textContent='0%';hint.classList.remove('hide');if(redraw)draw()}
function layout(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=Math.min(H*.70,620),w=Math.min(W*.74,h*.5);p.w=w;p.h=h;p.x=(W-w)/2;p.y=(H-h)/2+14;p.r=Math.min(38,w*.11);if(!p.frontFaults)reset(false);draw()}addEventListener('resize',layout);
function screen(){let m=p.w*.062;return{x:m,y:m,w:p.w-2*m,h:p.h-2*m,r:p.r*.76}}function cams(){return[[p.w*.27,p.h*.13],[p.w*.42,p.h*.13],[p.w*.345,p.h*.24]]}function matrix(){let shx=p.tx*.004,shy=p.ty*.003,sx=1-Math.abs(p.ty)*.0018,sy=1-Math.abs(p.tx)*.0013;return{a:sx,b:shy,c:shx,d:sy,e:p.x+p.w/2,f:p.y+p.h/2}}function worldToLocal(x,y){let m=matrix(),X=x-m.e,Y=y-m.f,det=m.a*m.d-m.b*m.c;if(!det)return{x:-999,y:-999};return{x:(m.d*X-m.c*Y)/det+p.w/2,y:(-m.b*X+m.a*Y)/det+p.h/2}}function applyPhoneTransform(){let m=matrix();ctx.translate(m.e,m.f);ctx.rotate(p.rot);ctx.transform(m.a,m.b,m.c,m.d,0,0);ctx.translate(-p.w/2,-p.h/2)}function inside(x,y){return x>=0&&x<=p.w&&y>=0&&y<=p.h}function insideScreen(x,y){let s=screen();return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h}
function cellKey(x,y,cols=6,rows=10){return Math.floor(C(y/p.h*rows,0,rows-1))+'-'+Math.floor(C(x/p.w*cols,0,cols-1))}function bump(map,key){map.set(key,Math.min(4,(map.get(key)||0)+1))}function score(map){let n=0;for(const v of map.values())n+=v===1?1:v===2?1.55:v===3?1.9:2.15;return n}function coverage(map,maxCells=60){return C(map.size/maxCells,0,1)}
function wallpaper(s){let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'#123a83');g.addColorStop(.4,'#6549db');g.addColorStop(.73,'#da5aa3');g.addColorStop(1,'#f59b60');ctx.fillStyle=g;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();let q=ctx.createLinearGradient(s.x,s.y,s.x+s.w*.7,s.y+s.h);q.addColorStop(0,'rgba(255,255,255,.19)');q.addColorStop(.18,'rgba(255,255,255,.03)');q.addColorStop(.5,'rgba(255,255,255,0)');q.addColorStop(1,'rgba(255,255,255,.035)');ctx.fillStyle=q;rr(s.x,s.y,s.w,s.h,s.r);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`700 ${Math.max(18,s.w*.16)}px system-ui`;ctx.fillText('9:41',s.x+s.w/2,s.y+s.h*.25);ctx.font=`500 ${Math.max(9,s.w*.045)}px system-ui`;ctx.fillText('Saturday, August 8',s.x+s.w/2,s.y+s.h*.31)}
function addFrontFault(x,y){let s=screen(),t=Math.floor(R(0,4));if(t===0)p.frontFaults.push({t:'bruise',x,y,r:R(10,22),h:R(220,330),a:R(.14,.28)});else if(t===1)p.frontFaults.push({t:'dead',x,y,rx:R(6,14),ry:R(9,26),rot:R(-.5,.5),a:R(.3,.55)});else if(t===2)p.frontFaults.push({t:'line',x:C(x+R(-5,5),s.x+2,s.x+s.w-2),y1:C(y-R(14,38),s.y,s.y+s.h),y2:C(y+R(14,38),s.y,s.y+s.h),h:R(150,330),a:R(.18,.4)});else p.frontMarks.push({x,y,rx:R(5,13),ry:R(1.5,4),rot:R(-1,1),a:R(.06,.12)})}
function addBackDamage(x,y){const m=9,b={x:m,y:m,w:p.w-2*m,h:p.h-2*m};x=C(x,b.x,b.x+b.w);y=C(y,b.y,b.y+b.h);let near=-1,dist=22;for(let i=0;i<p.backCracks.length;i++){let a=p.backCracks[i],d=Math.hypot(x-a.x,y-a.y);if(d<dist){dist=d;near=i}}if(near>=0){let a=p.backCracks[near];a.level=Math.min(3,a.level+1);a.branches=Math.min(7,a.branches+1)}else p.backCracks.push({x,y,seed:Math.random()*999,level:1,branches:Math.floor(R(2,5))});if(Math.random()<.32)p.backScuffs.push({x,y,rx:R(5,14),ry:R(1.4,4),rot:R(-1,1),a:R(.06,.13)});if(Math.random()<.24)p.backDents.push({x,y,rx:R(5,12),ry:R(2,5),rot:R(-.8,.8)})}
function drawFront(){let s=screen();ctx.save();rr(s.x,s.y,s.w,s.h,s.r);ctx.clip();if(!p.screenOff)wallpaper(s);else{ctx.fillStyle='#010205';ctx.fillRect(s.x,s.y,s.w,s.h);let g=ctx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);g.addColorStop(0,'rgba(255,255,255,.09)');g.addColorStop(.22,'rgba(255,255,255,.01)');g.addColorStop(.55,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.025)');ctx.fillStyle=g;ctx.fillRect(s.x,s.y,s.w,s.h)}if(!p.screenOff)for(const f of p.frontFaults){if(f.t==='bruise'){let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`hsla(${f.h},90%,62%,${f.a})`);g.addColorStop(.55,`hsla(${f.h+50},90%,55%,${f.a*.22})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}else if(f.t==='dead'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=`rgba(0,0,0,${f.a})`;ctx.beginPath();ctx.ellipse(0,0,f.rx,f.ry,0,0,7);ctx.fill();ctx.restore()}else{ctx.strokeStyle=`hsla(${f.h},95%,65%,${f.a})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(f.x,f.y1);ctx.lineTo(f.x,f.y2);ctx.stroke()}}for(const m of p.frontMarks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle=`rgba(255,255,255,${m.a})`;ctx.beginPath();ctx.ellipse(0,0,m.rx,m.ry,0,0,7);ctx.fill();ctx.restore()}ctx.restore()}
function drawCamera(q,i){let d=p.cam[i],outer=p.w*.089,lens=p.w*.057;ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.beginPath();ctx.arc(q[0],q[1],outer,0,7);let rg=ctx.createRadialGradient(q[0]-3,q[1]-4,2,q[0],q[1],outer);rg.addColorStop(0,'#59636f');rg.addColorStop(.3,'#2d343d');rg.addColorStop(.7,'#141920');rg.addColorStop(1,'#070a0e');ctx.fillStyle=rg;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(q[0],q[1],lens,0,7);let lg=ctx.createRadialGradient(q[0]-3,q[1]-4,1,q[0],q[1],lens);lg.addColorStop(0,d>=5?'#232323':'#214f77');lg.addColorStop(.42,d>=4?'#0d0d0f':'#0b2238');lg.addColorStop(1,'#010204');ctx.fillStyle=lg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.19)';ctx.lineWidth=.7;ctx.stroke();ctx.beginPath();ctx.arc(q[0]-lens*.23,q[1]-lens*.24,lens*.18,0,7);ctx.fillStyle=d>=4?'rgba(255,255,255,.02)':'rgba(180,230,255,.28)';ctx.fill();if(d>0){ctx.beginPath();ctx.arc(q[0],q[1],lens*.9,0,7);ctx.fillStyle=`rgba(210,220,225,${Math.min(.28,d*.045)})`;ctx.fill()}ctx.restore()}
function drawCrack(cr){let n=cr.branches,rad=18+cr.level*8;for(let i=0;i<n;i++){let a=(cr.seed+i*2.17)%6.283,px=cr.x,py=cr.y;ctx.beginPath();ctx.moveTo(px,py);for(let j=1;j<=4;j++){a+=Math.sin(cr.seed+i*9+j*4)*.16;let len=rad/4*(.82+((cr.seed+i+j*3)%7)/20);px+=Math.cos(a)*len;py+=Math.sin(a)*len;px=C(px,10,p.w-10);py=C(py,10,p.h-10);ctx.lineTo(px,py)}ctx.strokeStyle='rgba(55,62,70,.58)';ctx.lineWidth=.48;ctx.stroke()}}
function drawBack(){let base=ctx.createLinearGradient(0,0,p.w,p.h);base.addColorStop(0,'#e7e9ec');base.addColorStop(.3,'#cdd2d7');base.addColorStop(.66,'#a5adb5');base.addColorStop(1,'#788089');ctx.fillStyle=base;rr(0,0,p.w,p.h,p.r);ctx.fill();let gloss=ctx.createLinearGradient(0,0,p.w*.9,p.h);gloss.addColorStop(0,'rgba(255,255,255,.38)');gloss.addColorStop(.14,'rgba(255,255,255,.09)');gloss.addColorStop(.48,'rgba(255,255,255,0)');gloss.addColorStop(1,'rgba(0,0,0,.075)');ctx.fillStyle=gloss;rr(4,4,p.w-8,p.h-8,p.r-4);ctx.fill();ctx.fillStyle='rgba(0,0,0,.07)';ctx.beginPath();ctx.arc(p.w*.5,p.h*.57,p.w*.11,0,7);ctx.fill();cams().forEach((q,i)=>drawCamera(q,i));ctx.save();rr(8,8,p.w-16,p.h-16,p.r-8);ctx.clip();ctx.shadowColor='transparent';for(const cr of p.backCracks)drawCrack(cr);for(const s of p.backScuffs){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=`rgba(55,60,66,${s.a})`;ctx.beginPath();ctx.ellipse(0,0,s.rx,s.ry,0,0,7);ctx.fill();ctx.restore()}for(const d of p.backDents){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);let g=ctx.createRadialGradient(0,0,0,0,0,Math.max(d.rx,d.ry));g.addColorStop(0,'rgba(0,0,0,.16)');g.addColorStop(.72,'rgba(0,0,0,.04)');g.addColorStop(1,'rgba(255,255,255,.045)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,7);ctx.fill();ctx.restore()}ctx.restore()}
function drawDents(list){ctx.save();rr(1,1,p.w-2,p.h-2,p.r-1);ctx.clip();for(const d of list){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);let g=ctx.createRadialGradient(0,0,0,0,0,Math.max(d.rx,d.ry));g.addColorStop(0,'rgba(0,0,0,.33)');g.addColorStop(.72,'rgba(0,0,0,.08)');g.addColorStop(1,'rgba(255,255,255,.06)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,d.rx,d.ry,0,0,7);ctx.fill();ctx.restore()}ctx.restore()}
function drawPhone(){ctx.save();applyPhoneTransform();ctx.globalAlpha=p.fade;let ang=p.flip*Math.PI,frontness=Math.cos(ang),sx=Math.max(.075,Math.abs(frontness)),side=Math.sin(ang),depth=8+Math.abs(side)*14;ctx.translate(p.w/2,0);ctx.scale(sx,1);ctx.translate(-p.w/2,0);ctx.shadowColor='rgba(0,0,0,.68)';ctx.shadowBlur=32;ctx.shadowOffsetY=20;ctx.fillStyle='#04070a';rr(depth*(side>=0?1:-1),depth*.28,p.w,p.h,p.r);ctx.fill();ctx.shadowBlur=0;let edge=ctx.createLinearGradient(0,0,p.w,0);edge.addColorStop(0,'#707985');edge.addColorStop(.08,'#3c434c');edge.addColorStop(.26,'#20252b');edge.addColorStop(.5,'#11151a');edge.addColorStop(.76,'#2d333a');edge.addColorStop(.93,'#515a64');edge.addColorStop(1,'#7a8490');ctx.fillStyle=edge;rr(0,0,p.w,p.h,p.r);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.3;rr(1.5,1.5,p.w-3,p.h-3,p.r-2);ctx.stroke();if(frontness>=0){drawFront();drawDents(p.frontDents)}else drawBack();ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);drawPhone()}
function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function noise(v=.04,h=800,d=.05,type='highpass'){if(!soundOn)return;let A=audioCtx(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),z=b.getChannelData(0);for(let i=0;i<n;i++)z[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);let s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type=type;f.frequency.value=h;g.gain.value=v;s.connect(f).connect(g).connect(A.destination);s.start()}function thump(freq=150,gain=.04,dur=.08){if(!soundOn)return;const A=audioCtx(),now=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.45),now+dur);g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(A.destination);o.start();o.stop(now+dur+.01)}function hitSound(k){if(k==='frame'){thump(R(105,150),.055,.09);noise(.04,900,.045)}else if(k==='cam'){thump(R(170,230),.035,.06);noise(.045,1500,.035)}else if(k==='back'){thump(R(125,175),.05,.08);noise(.035,650,.05,'bandpass')}else{thump(R(145,190),.042,.065);noise(.03,850,.04,'bandpass')}}
function progress(){let fCov=coverage(p.frontCells),bCov=coverage(p.backCells),frCov=coverage(p.frameCells);let fSev=C(score(p.frontCells)/52,0,1),bSev=C(score(p.backCells)/52,0,1),frSev=C(score(p.frameCells)/28,0,1);let front=35*C(fCov*.58+fSev*.24+Math.min(1,(p.frontFaults.length+p.frontMarks.length*.35)/12)*.10+(p.screenOff?.08:0),0,1);let back=35*C(bCov*.60+bSev*.25+Math.min(1,(p.backCracks.length+p.backDents.length*.45+p.backScuffs.length*.2)/15)*.15,0,1);let frame=15*C(frCov*.62+frSev*.38,0,1);let cameras=15*C(p.cam.reduce((a,b)=>a+b,0)/18,0,1);let d=front+back+frame+cameras;let active=(p.frontCells.size>0)+(p.backCells.size>0)+(p.frameCells.size>0)+(p.cam.some(v=>v>0)?1:0);if(d>72&&active>=3)d+=Math.min(8,(p.totalHits-35)*.16);return C(d,0,100)}function damage(){let d=progress();fill.style.width=d+'%';pct.textContent=Math.round(d)+'%';if(d>=99&&!done)finish()}
function kick(x,y){p.vx+=(x/p.w-.5)*4;p.vy+=(y/p.h-.5)*4;p.vr+=(x/p.w-.5)*.005;startAnim()}function startAnim(){if(anim)return;anim=true;requestAnimationFrame(step)}function step(){p.tx+=p.vx;p.ty+=p.vy;p.rot+=p.vr;p.vx+=(-p.tx*.11-p.vx*.32);p.vy+=(-p.ty*.11-p.vy*.32);p.vr+=(-p.rot*.15-p.vr*.3);p.flip+=(p.flipTarget-p.flip)*.18;draw();if(Math.abs(p.tx)+Math.abs(p.ty)+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.rot)*100+Math.abs(p.flipTarget-p.flip)*60>.12&&!done)requestAnimationFrame(step);else{p.tx=p.ty=p.vx=p.vy=p.rot=p.vr=0;p.flip=p.flipTarget;anim=false;draw()}}
function finish(){done=true;total++;count.textContent='Destroyed: '+total;thump(80,.1,.18);noise(.1,420,.16,'bandpass');navigator.vibrate?.([18,24,38]);let st=performance.now();function fall(){let t=(performance.now()-st)/850;p.fade=Math.max(0,1-t*.8);p.y+=2+t*7;p.rot+=.01;draw();if(t<1)requestAnimationFrame(fall);else setTimeout(()=>{reset(false);layout()},450)}requestAnimationFrame(fall)}
function hit(wx,wy){if(done)return;let q=worldToLocal(wx,wy),x=q.x,y=q.y;if(!inside(x,y))return;hint.classList.add('hide');p.totalHits++;let kind=p.side==='front'?'screen':'back';if(p.side==='front'){if(insideScreen(x,y)){p.screenHits++;bump(p.frontCells,cellKey(x,y));if(!p.screenOff){if(p.frontFaults.length<14&&Math.random()<.34)addFrontFault(x,y);if(p.screenHits>=38||score(p.frontCells)>=31)p.screenOff=true}else if(p.frontMarks.length<18&&Math.random()<.24)p.frontMarks.push({x,y,rx:R(5,13),ry:R(1.5,4),rot:R(-1,1),a:R(.06,.13)})}else{bump(p.frameCells,cellKey(x,y));if(p.frontDents.length<24)p.frontDents.push({x:C(x,2,p.w-2),y:C(y,2,p.h-2),rx:R(5,11),ry:R(2,4.5),rot:R(-.7,.7)});kind='frame'}}else{let k=-1,bd=p.w*.1;cams().forEach((q,i)=>{let d=Math.hypot(x-q[0],y-q[1]);if(d<bd){bd=d;k=i}});if(k>=0){p.cam[k]=Math.min(6,p.cam[k]+1);bump(p.backCells,cellKey(x,y));kind='cam'}else{p.backHits++;bump(p.backCells,cellKey(x,y));addBackDamage(x,y);kind='back'}}hitSound(kind);kick(x,y);navigator.vibrate?.(7);damage();draw()}
function flipPhone(){p.side=p.side==='front'?'back':'front';p.flipTarget=p.side==='front'?0:1;startAnim()}stage.addEventListener('pointerdown',e=>dragX=e.clientX);stage.addEventListener('pointerup',e=>{let dx=e.clientX-dragX;if(Math.abs(dx)>45)flipPhone();else{let r=c.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)}dragX=null});document.getElementById('reset').onclick=()=>{reset(false);layout()};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='Sound: '+(soundOn?'ON':'OFF')};layout();
</script></body></html>
